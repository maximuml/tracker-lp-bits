# T-16: Codecov configuration for coverage pipeline.
#
# - Patch coverage target: 60% of new/changed lines must be covered.
#   This is enforced server-side by Codecov when CODECOV_TOKEN is set.
# - Project coverage target: 35% (floor — raise gradually).
# - Flags: unit, feature (uploaded separately from CI).
# - Carryforward: if coverage drops, the PR comment explains why.

coverage:
  status:
    project:
      default:
        target: 35%
        threshold: 1%
        # W0-04 follow-up: keep project coverage informational until the
        # per-module ratchet has been running fail-closed for one release.
        informational: true
    patch:
      default:
        target: 60%
        threshold: 5%
        # W0-04: patch coverage is now fail-closed. PRs must cover 60% of
        # changed lines. Use `codecov-bypass` label with maintainer approval
        # if a PR legitimately cannot be covered (e.g., configuration only).
        informational: false

flags:
  unit:
    paths:
      - app/
    carryforward: true
  feature:
    paths:
      - app/
    carryforward: true

comment:
  layout: "reach,diff,flags,tree,reach"
  behavior: default
  require_changes: false

ignore:
  - "tests/"
  - "vendor/"
  - "database/"
  - "config/"
  - "routes/"
  - "resources/"
  - "public/"
  - "lang/"
  - "bootstrap/"
  - "app/Support/Install/"
