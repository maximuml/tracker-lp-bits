name: Performance budget

on:
  push:
    branches: [php8]
  pull_request:
    branches: [php8]

permissions:
  contents: read

concurrency:
  group: perf-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k6-baseline:
    name: k6 performance baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A7745778AF5C2F2C3F5C5B5C5
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Build and start Docker stack
        env:
          NP_PORT: '80'
          REDIS_PASSWORD: 'ci-redis-test-password'
          MEILISEARCH_MASTER_KEY: 'ci-meilisearch-test-key'
        run: |
          cp .env.example .env
          sed -i 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=ci-redis-test-password/' .env
          sed -i 's/^MEILISEARCH_MASTER_KEY=.*/MEILISEARCH_MASTER_KEY=ci-meilisearch-test-key/' .env
          docker compose build
          # Start mysql + redis first, wait for them
          docker compose up -d --wait mysql redis
          # Start php (runs composer install + config:cache in entrypoint)
          docker compose up -d php
          # Wait for PHP-FPM to be ready
          echo "Waiting for PHP-FPM to finish setup..."
          for i in $(seq 1 60); do
            if docker compose exec -T php php -r "echo 'ready';" 2>/dev/null | grep -q ready; then
              echo "PHP-FPM ready after ${i}0s"
              break
            fi
            sleep 10
          done
          # Run migrations + seed
          docker compose exec -T php php artisan migrate:fresh --seed --force
          docker compose exec -T php php artisan storage:link --force
          # Start openresty
          docker compose up -d openresty
          # Wait for openresty to serve /health/live
          echo "Waiting for OpenResty to serve requests..."
          for i in $(seq 1 30); do
            if curl -sfL http://127.0.0.1:80/health/live -o /dev/null 2>/dev/null; then
              echo "OpenResty ready after ${i}s"
              break
            fi
            sleep 2
          done
          # Final check
          curl -sfL http://127.0.0.1:80/health/live || (echo "::error::OpenResty not responding" && exit 1)

      - name: Run k6 performance baseline
        run: |
          k6 run --env BASE_URL=http://127.0.0.1:80 tests/Performance/baseline.js
