name: Weekly security scan

on:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy-full-scan:
    name: Trivy full image scan (all severities)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's|DB_HOST=127.0.0.1|DB_HOST=mysql|g' .env
          sed -i 's|REDIS_HOST=127.0.0.1|REDIS_HOST=redis|g' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=nexusphp/' .env
          sed -i 's|^MEILISEARCH_MASTER_KEY=.*|MEILISEARCH_MASTER_KEY=nexusphp_default_key|' .env
          echo "COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml" >> "$GITHUB_ENV"

      - name: Build Docker images
        run: docker compose build php openresty

      - name: Check .trivyignore expiry dates
        run: bash scripts/check_trivy_expiry.sh

      - name: Run Trivy on PHP image (all severities)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: nexusphp_php:latest
          format: sarif
          output: trivy-php-full.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: '0'
          ignore-unfixed: false
          version: v0.74.0

      - name: Run Trivy on OpenResty image (all severities)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: nexusphp_openresty:latest
          format: sarif
          output: trivy-openresty-full.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: '0'
          ignore-unfixed: false
          version: v0.74.0

      - name: Upload Trivy full scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        with:
          sarif_file: trivy-php-full.sarif

      - name: Upload OpenResty scan results
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        with:
          sarif_file: trivy-openresty-full.sarif

  semgrep-full-scan:
    name: Semgrep full scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Semgrep
        run: pip install semgrep==1.89.0

      - name: Run blocking Semgrep rules
        run: |
          semgrep scan --config .semgrep.blocking.yml --sarif --output semgrep-blocking-results.sarif

      - name: Run informational Semgrep rules
        run: |
          semgrep scan --config .semgrep.informational.yml --sarif --output semgrep-info-results.sarif

      - name: Upload blocking results to GitHub Security
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        with:
          sarif_file: semgrep-blocking-results.sarif

      - name: Upload informational results to GitHub Security
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        with:
          sarif_file: semgrep-info-results.sarif

  composer-audit:
    name: Composer audit (advisories)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, gd, gmp, intl, json, mbstring, mysqli, pdo, pdo_mysql, redis, sqlite3, xml, zip
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Run composer audit
        run: composer audit --no-dev
