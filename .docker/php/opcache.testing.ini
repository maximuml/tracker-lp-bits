; OPcache defaults for the test stack (docker-compose.test.yml).
; Mirrors the dev profile: bind-mounted sources must be revalidated and
; the CLI SAPI (phpunit/composer run via `sh -c`) stays uncached so test
; runs never execute stale bytecode.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
opcache.save_comments = 1
