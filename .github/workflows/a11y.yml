name: A11y accessibility scan

on:
  push:
    branches: [php8]
  pull_request:
    branches: [php8]

permissions:
  contents: read

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe-scan:
    name: axe-core accessibility scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable

      - name: Install axe-core CLI
        run: npm install -g @axe-core/cli

      - name: Install matching ChromeDriver
        run: npx --yes browser-driver-manager install chrome@stable

      - name: Build and start Docker stack
        env:
          NP_PORT: '80'
          REDIS_PASSWORD: 'ci-redis-test-password'
          MEILISEARCH_MASTER_KEY: 'ci-meilisearch-test-key'
          DB_HOST: 'mysql'
          DB_PORT: '3306'
          DB_DATABASE: 'nexusphp'
          DB_USERNAME: 'nexusphp'
          DB_PASSWORD: 'nexusphp'
          APP_NAME: 'NexusPHP'
          PUSHER_APP_KEY: ''
          PUSHER_APP_CLUSTER: ''
        run: |
          cp .env.example .env
          # Set CI DB password (.env.example uses a placeholder)
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=nexusphp/' .env
          # Set CI Redis password (docker-compose requires it)
          sed -i 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=ci-redis-test-password/' .env
          # Set CI MeiliSearch key (docker-compose requires it)
          sed -i 's/^MEILISEARCH_MASTER_KEY=.*/MEILISEARCH_MASTER_KEY=ci-meilisearch-test-key/' .env
          # Replace ${VAR} references that docker compose can't interpolate
          sed -i 's/\${DB_HOST}/mysql/g' .env
          sed -i 's/\${APP_NAME}/NexusPHP/g' .env
          sed -i 's/\${PUSHER_APP_KEY}//g' .env
          sed -i 's/\${PUSHER_APP_CLUSTER}//g' .env
          docker compose build
          # Start mysql + redis first, wait for them
          docker compose up -d --wait mysql redis
          # Start php (runs composer install + config:cache in entrypoint)
          docker compose up -d php
          # Wait for PHP-FPM to be ready (entrypoint runs composer install + config:cache)
          # Check artisan (not php -r) because vendor/autoload.php must exist
          echo "Waiting for PHP-FPM to finish setup..."
          for i in $(seq 1 60); do
            if docker compose --env-file /dev/null exec -T php php artisan --version 2>/dev/null | grep -q "Laravel"; then
              echo "PHP-FPM ready after ${i}0s"
              break
            fi
            sleep 10
          done
          # Run migrations + seed
          docker compose --env-file /dev/null exec -T php php artisan migrate:fresh --seed --force
          docker compose --env-file /dev/null exec -T php php artisan storage:link --force
          # Start openresty (don't use --wait, healthcheck may fail during Laravel boot)
          docker compose up -d openresty
          # Wait for openresty to serve /health/live
          echo "Waiting for OpenResty to serve requests..."
          for i in $(seq 1 30); do
            if curl -sfL http://127.0.0.1:80/health/live -o /dev/null 2>/dev/null; then
              echo "OpenResty ready after ${i}s"
              break
            fi
            sleep 2
          done
          # Final check
          curl -sfL http://127.0.0.1:80/health/live || (echo "::error::OpenResty not responding" && exit 1)
          docker compose --env-file /dev/null exec -T redis sh -c "redis-cli -a \"${REDIS_PASSWORD:-}\" FLUSHALL" 2>/dev/null || true

      - name: Run axe-core scans
        run: |
          set -e
          BASE=http://127.0.0.1:80
          PASS=0
          FAIL=0
          RESULTS_DIR="axe-results"
          mkdir -p "$RESULTS_DIR"

          # Pages that don't require authentication
          PAGES="/index.php /login.php /signup.php /faq.php /rules.php /aboutnexus.php /recover.php"

          for page in $PAGES; do
            echo "::group::Scanning $page"
            PAGE_NAME=$(echo "$page" | tr '/' '_')
            RESULT_FILE="$RESULTS_DIR/${PAGE_NAME}.json"
            if axe "$BASE$page" --exit --tags wcag2a,wcag2aa,wcag21a,wcag21aa --load-delay=3000 --chrome-options="no-sandbox,disable-dev-shm-usage" --save "$RESULT_FILE" 2>&1; then
              echo "PASS: $page"
              PASS=$((PASS + 1))
            else
              echo "FAIL: $page"
              FAIL=$((FAIL + 1))
              # Print violation summary
              if [ -f "$RESULT_FILE" ]; then
                echo "::error::Violations on $page (see $RESULT_FILE for details)"
                # Show violation count from JSON
                VIOLATIONS=$(jq '.violations | length' "$RESULT_FILE" 2>/dev/null || echo "?")
                echo "  Violations: $VIOLATIONS"
              fi
            fi
            echo "::endgroup::"
          done

          echo "Results: $PASS passed, $FAIL failed"
          if [ "$FAIL" -gt 0 ]; then
            echo "::error::$FAIL pages have accessibility violations"
            exit 1
          fi

      - name: Upload axe results
        if: always()
        uses: actions/upload-artifact@b4b6b8956e3a64b9675f3d6f1f3f6a0c4420111a # v4
        with:
          name: axe-results
          path: axe-results/
          retention-days: 14
