name: Performance budget

on:
  push:
    branches: [php8]
  pull_request:
    branches: [php8]

permissions:
  contents: read
  actions: read

concurrency:
  group: perf-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k6-baseline:
    name: k6 performance baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, gd, gmp, intl, json, mbstring, mysqli, pdo, pdo_mysql, redis, sqlite3, xml, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'

      - name: Install k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Dump autoload
        run: composer dump-autoload --no-interaction --no-scripts

      - name: Build and start Docker stack
        env:
          NP_PORT: '80'
          REDIS_PASSWORD: 'ci-redis-test-password'
          MEILISEARCH_MASTER_KEY: 'ci-meilisearch-test-key'
          DB_HOST: 'mysql'
          DB_PORT: '3306'
          DB_DATABASE: 'nexusphp_e2e_testing'
          DB_USERNAME: 'nexusphp'
          DB_PASSWORD: 'nexusphp'
          APP_NAME: 'NexusPHP'
          PUSHER_APP_KEY: ''
          PUSHER_APP_CLUSTER: ''
        run: |
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=nexusphp/' .env
          sed -i 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=ci-redis-test-password/' .env
          sed -i 's/^MEILISEARCH_MASTER_KEY=.*/MEILISEARCH_MASTER_KEY=ci-meilisearch-test-key/' .env
          # Use isolated E2E testing database (never the dev/production DB).
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=nexusphp_e2e_testing/' .env
          # Point DB/Redis at Docker service hostnames (not 127.0.0.1)
          sed -i 's/^DB_HOST=.*/DB_HOST=mysql/' .env
          sed -i 's/^REDIS_HOST=.*/REDIS_HOST=redis/' .env
          # Replace ${VAR} references that docker compose can't interpolate
          sed -i 's/\${DB_HOST}/mysql/g' .env
          sed -i 's/\${APP_NAME}/NexusPHP/g' .env
          sed -i 's/\${PUSHER_APP_KEY}//g' .env
          sed -i 's/\${PUSHER_APP_CLUSTER}//g' .env
          # Use dev overrides (bind-mounts, openresty config mounts)
          export COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml
          docker compose build
          # Start mysql + redis first, wait for them
          docker compose up -d --wait mysql redis
          # Start php (vendor/ already populated on host via bind-mount)
          docker compose up -d --wait php
          # Run migrations + seed (base seeders + T-17 perf dataset)
          docker compose exec -T php php artisan migrate:fresh --seed --force
          docker compose exec -T php php artisan db:seed --class=PerformanceTestDatasetSeeder --force
          docker compose exec -T php php artisan storage:link --force
          # Start openresty
          docker compose up -d openresty
          # Wait for openresty to serve /health/live
          echo "Waiting for OpenResty to serve requests..."
          for i in $(seq 1 30); do
            if curl -sfL http://127.0.0.1:80/health/live -o /dev/null 2>/dev/null; then
              echo "OpenResty ready after ${i}s"
              break
            fi
            sleep 2
          done
          # Final check
          curl -sfL http://127.0.0.1:80/health/live || (echo "::error::OpenResty not responding" && exit 1)

      - name: Extract passkey and info_hash for tracker tests
        id: tracker-creds
        run: |
          # T-17: Extract passkey from perf_user_1 and info_hash from perf-torrent-1
          PASSKEY=$(docker compose exec -T php php artisan tinker --execute='echo App\Models\User::where("username","perf_user_1")->value("passkey") ?? "";' 2>/dev/null | tr -d '[:space:]')
          INFO_HASH=$(docker compose exec -T php php artisan tinker --execute='echo App\Models\Torrent::where("name","perf-torrent-1")->value("info_hash") ?? "";' 2>/dev/null | tr -d '[:space:]')
          INFO_HASHES=$(docker compose exec -T php php artisan tinker --execute='echo App\Models\Torrent::where("name","like","perf-torrent-%")->orderBy("id")->limit(5)->pluck("info_hash")->implode(",");' 2>/dev/null | tr -d '[:space:]')
          # The tracker allows one leeching peer per (user, torrent) — multi-peer
          # scenarios need several distinct users.
          PASSKEYS=$(docker compose exec -T php php artisan tinker --execute='echo App\Models\User::where("username","like","perf_user_%")->orderBy("id")->limit(10)->pluck("passkey")->implode(",");' 2>/dev/null | tr -d '[:space:]')
          # Degradation runs after announce.js left peer rows — use a torrent
          # no other scenario touches.
          DEGRADED_HASH=$(docker compose exec -T php php artisan tinker --execute='echo App\Models\Torrent::where("name","perf-torrent-6")->value("info_hash") ?? "";' 2>/dev/null | tr -d '[:space:]')
          echo "Extracted passkey: ${PASSKEY:0:8}..."
          echo "Extracted info_hash: ${INFO_HASH:0:8}..."
          echo "Extracted info_hashes: ${INFO_HASHES:0:8}... (${INFO_HASHES//,/ } | wc -w) hashes"
          echo "passkey=$PASSKEY" >> "$GITHUB_OUTPUT"
          echo "info_hash=$INFO_HASH" >> "$GITHUB_OUTPUT"
          echo "info_hashes=$INFO_HASHES" >> "$GITHUB_OUTPUT"
          echo "passkeys=$PASSKEYS" >> "$GITHUB_OUTPUT"
          echo "degraded_hash=$DEGRADED_HASH" >> "$GITHUB_OUTPUT"

      - name: Run k6 performance baseline (web UI)
        run: |
          mkdir -p perf-results
          k6 run --env BASE_URL=http://127.0.0.1:80 \
            --env USERNAME=perf_user_1 \
            --env PASSWORD=PerfTest2026! \
            tests/Performance/baseline.js

      - name: Run k6 tracker load test (announce + scrape)
        run: |
          mkdir -p perf-results
          k6 run --env BASE_URL=http://127.0.0.1:80 \
            --env DEBUG_BODY=1 \
            --env PASSKEY=${{ steps.tracker-creds.outputs.passkey }} \
            --env INFO_HASH=${{ steps.tracker-creds.outputs.info_hash }} \
            --env INFO_HASHES=${{ steps.tracker-creds.outputs.info_hashes }} \
            --env PASSKEYS=${{ steps.tracker-creds.outputs.passkeys }} \
            --env GITHUB_SHA=${{ github.sha }} \
            tests/Performance/announce.js

      - name: Run k6 tracker load with Redis down (degradation)
        run: |
          docker compose stop redis
          sleep 2
          # Trip the Redis circuit breaker before measuring: the first request
          # pays the ~5-10s DNS/connect detection stall, then RedisGuard marks
          # Redis down and subsequent requests fail fast from the DB path.
          curl -s -o /dev/null -m 30 --get \
            -H "User-Agent: qBittorrent/5.0.0" \
            --data-urlencode "passkey=${{ steps.tracker-creds.outputs.passkey }}" \
            --data-urlencode "info_hash=${{ steps.tracker-creds.outputs.info_hash }}" \
            --data-urlencode "peer_id=-qB5000-WARMUP000000" \
            --data-urlencode "port=51413" --data-urlencode "uploaded=0" \
            --data-urlencode "downloaded=0" --data-urlencode "left=1" \
            --data-urlencode "event=stopped" \
            "http://127.0.0.1:80/announce.php" || true
          # The tracker must keep answering — bounded response or fast failure.
          mkdir -p perf-results
          K6_EXIT=0
          k6 run --env BASE_URL=http://127.0.0.1:80 \
            --env PASSKEY=${{ steps.tracker-creds.outputs.passkey }} \
            --env PASSKEYS=${{ steps.tracker-creds.outputs.passkeys }} \
            --env INFO_HASH=${{ steps.tracker-creds.outputs.info_hash }} \
            --env DEGRADED_HASH=${{ steps.tracker-creds.outputs.degraded_hash }} \
            --env GITHUB_SHA=${{ github.sha }} \
            tests/Performance/redis-degradation.js || K6_EXIT=$?
          docker compose start redis
          exit $K6_EXIT

      - name: Upload perf results artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: k6-perf-results
          path: perf-results/
          retention-days: 90

      - name: Compare against baseline (>20% regression fails)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p perf-baseline
          # Baseline = artifact of the latest successful run on the default branch.
          RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/perf-budget.yml/runs?branch=php8&status=success&per_page=10" \
            --jq '[.workflow_runs[] | select(.head_sha != "'"${GITHUB_SHA}"'")][0].id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::warning::No baseline run found — skipping regression compare"
            exit 0
          fi
          echo "Baseline run: $RUN_ID"
          if ! gh run download "$RUN_ID" -n k6-perf-results -D perf-baseline; then
            echo "::warning::Baseline artifact unavailable — skipping regression compare"
            exit 0
          fi
          node tests/Performance/compare-results.js perf-baseline perf-results
