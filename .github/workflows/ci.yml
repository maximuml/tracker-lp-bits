name: CI

on:
  push:
    branches: ["php8"]
  pull_request:
    branches: ["php8"]

jobs:
  lint-and-validate:
    name: Lint PHP and validate composer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, gd, gmp, intl, json, mbstring, mysqli, pdo, redis, sqlite3, xml, zip
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-reqs --no-scripts

      - name: Dump autoload
        run: composer dump-autoload --no-interaction --no-scripts

      - name: Audit composer dependencies
        run: composer audit

      - name: Run PHP syntax lint
        run: |
          find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -not -path './.docker/*' \
            -not -path './public/vendor/*' \
            -not -path './storage/*' \
            -print0 | xargs -0 -n1 -P4 php -l

      - name: Run PHPStan on all PHP files
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      - name: Run PHPStan level 5 on app/Support and app/Models
        run: vendor/bin/phpstan analyse -c phpstan.level5.neon --no-progress --memory-limit=2G

      - name: Run PHPUnit unit tests
        run: vendor/bin/phpunit --testsuite Unit --no-coverage

  smoke-test:
    name: Docker smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, gd, gmp, intl, json, mbstring, mysqli, pdo, redis, sqlite3, xml, zip
          coverage: none

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's|DB_HOST=127.0.0.1|DB_HOST=mysql|g' .env
          sed -i 's|REDIS_HOST=127.0.0.1|REDIS_HOST=redis|g' .env
          sed -i 's|LOG_FILE=.*|LOG_FILE=php://stdout|g' .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-reqs --no-scripts

      - name: Dump autoload
        run: composer dump-autoload --no-interaction --no-scripts

      - name: Start Docker Compose
        run: docker compose up -d --build

      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            docker compose exec -T php php -v >/dev/null 2>&1 || { sleep 2; continue; }
            docker compose exec -T php php -r "new PDO('mysql:host=mysql;port=3306;dbname=nexusphp','nexusphp','nexusphp');" >/dev/null 2>&1 || { sleep 2; continue; }
            docker compose exec -T php php -r '$r = new Redis(); $r->connect("redis", 6379);' >/dev/null 2>&1 && break
            sleep 2
          done

      - name: Install database
        run: docker compose exec -T php php artisan migrate:fresh --seed --force

      - name: Smoke test public pages
        run: |
          set -e
          for page in /index.php /login.php /signup.php /torrents.php /topten.php; do
            echo "Testing $page"
            curl -sfL --max-time 10 "http://localhost$page" -o /dev/null
          done
