# Codecov configuration — ratchet coverage so it never decreases.
#
# project: overall coverage must not drop below auto (current) - 1%
# patch: changed lines must have at least 60% coverage
# Both are now blocking (informational: false) — PRs that drop
# coverage will fail the CI gate.

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: false
    patch:
      default:
        target: 60%
        threshold: 5%
        informational: false

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false

ignore:
  - "tests/**"
  - "database/**"
  - "config/**"
  - "routes/**"
  - "resources/**"
  - "public/**"
  - ".docker/**"
  - "_db/**"
