# Development overrides — bind-mount source code, backup volume, openresty config mounts.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#        docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile debug up  (with phpMyAdmin)

services:
  php:
    volumes:
      - .:/var/www/html
      - ${NP_BACKUP_EXPORT_PATH:-/tmp/nexusphp_backup}:${NP_BACKUP_EXPORT_PATH:-/tmp/nexusphp_backup}
      - ./.docker/php/dev-mailhog.ini:/usr/local/etc/php/conf.d/zz-dev-mailhog.ini:ro

  queue:
    volumes:
      - .:/var/www/html
      - ./.docker/php/dev-mailhog.ini:/usr/local/etc/php/conf.d/zz-dev-mailhog.ini:ro

  scheduler:
    volumes:
      - .:/var/www/html
      - ${NP_BACKUP_EXPORT_PATH:-/tmp/nexusphp_backup}:${NP_BACKUP_EXPORT_PATH:-/tmp/nexusphp_backup}
      - ./.docker/php/dev-mailhog.ini:/usr/local/etc/php/conf.d/zz-dev-mailhog.ini:ro

  openresty:
    volumes:
      - ./.docker/openresty/sites:/etc/nginx/conf.d/sites
      - ./.docker/openresty/certs:/certs
      - ./.docker/openresty/entrypoint.sh:/usr/local/bin/entrypoint.sh
      - ./.docker/openresty/render-config.sh:/usr/local/bin/render-config.sh
      - ./.docker/openresty/cert-watcher.sh:/usr/local/bin/cert-watcher.sh
      - ./.docker/openresty/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf
      - ./.docker/openresty/lua:/usr/local/openresty/lua
      - .:/var/www/html

  # Dev-only SMTP sink: .env.example already points MAIL_HOST at "mailhog".
  # Web UI on :8025, SMTP on :1025 (both inside appnet only).
  mailhog:
    image: mailhog/mailhog@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    container_name: nexusphp-mailhog
    # BusyBox sendmail only speaks to port 25 (no host:port) — the Web UI
    # keeps the stock :8025 inside appnet.
    command: ["-smtp-bind-addr", ":25"]
    profiles:
      - debug
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet

  # W1-09: phpMyAdmin moved from docker-compose.yml to dev-only overrides.
  # Never available in production or CI stacks.
  phpmyadmin:
    # T-13: Digest-pinned for reproducible builds. Update via Renovate.
    image: phpmyadmin/phpmyadmin@sha256:42a200db07b4e70fbf32c594ad4521cf16399b8e54bbb5adceae98e7566dfbeb
    container_name: nexusphp-phpmyadmin
    profiles:
      - debug
    environment:
      PMA_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet
