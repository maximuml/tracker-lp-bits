name: CI

on:
  push:
    branches: ["php8"]
  pull_request:
    branches: ["php8"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Lint + Pint + PHPStan L8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, gd, gmp, intl, json, mbstring, mysqli, pdo, pdo_mysql, redis, sqlite3, xml, zip
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Dump autoload
        run: composer dump-autoload --no-interaction --no-scripts

      - name: Audit composer dependencies
        run: composer audit

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Run PHP syntax lint
        run: |
          find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -not -path './.docker/*' \
            -not -path './public/vendor/*' \
            -not -path './storage/*' \
            -print0 | xargs -0 -n1 -P4 php -l

      - name: Run Laravel Pint
        run: vendor/bin/pint --test

      - name: Prepare environment for PHPStan
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run PHPStan level 8
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

  raw-sql-ratchet:
    name: Raw SQL ratchet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check raw SQL query count
        run: |
          BASELINE_COUNT=11
          CURRENT=$(grep -rn 'DB::\(select\|statement\|unprepared\)\s*(' app/ --include="*.php" \
            | grep -v 'Support/Install' \
            | wc -l)
          CURRENT_SUBQUERY=$(grep -rn 'DB::table\s*(\s*DB::raw' app/ --include="*.php" \
            | grep -v 'Support/Install' \
            | wc -l)
          TOTAL=$((CURRENT + CURRENT_SUBQUERY))
          echo "Baseline: $BASELINE_COUNT"
          echo "Current raw queries: $CURRENT"
          echo "Current raw subqueries: $CURRENT_SUBQUERY"
          echo "Total: $TOTAL"
          if [ "$TOTAL" -gt "$BASELINE_COUNT" ]; then
            echo "::error::Raw SQL query count increased from $BASELINE_COUNT to $TOTAL. \
          See .raw-queries-baseline.txt for the allowed list. \
          Use query builder instead of DB::select/statement/unprepared."
            exit 1
          fi
          echo "OK: raw SQL query count ($TOTAL) <= baseline ($BASELINE_COUNT)"

  frontend:
    name: Build + audit npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Audit npm dependencies
        # Retry up to 3 times — npm audit endpoint can return 503
        # transiently (Service Unavailable).
        run: |
          for i in 1 2 3; do
            if npm audit; then
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "::error::npm audit failed after 3 attempts"
              exit 1
            fi
            echo "npm audit attempt $i failed, retrying in 10s..."
            sleep 10
          done

  unit-tests:
    name: PHPUnit Unit (PHP ${{ matrix.php }}, MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        mysql: ['8.0', '9.0']

    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexusphp
          MYSQL_USER: nexusphp
          MYSQL_PASSWORD: nexusphp
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, gd, gmp, intl, json, mbstring, mysqli, pdo, pdo_mysql, redis, sqlite3, xml, zip
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Dump autoload
        run: composer dump-autoload --no-interaction --no-scripts

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=nexusphp/' .env
          sed -i 's/^CACHE_DRIVER=.*/CACHE_DRIVER=array/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          sed -i 's/^CHANNEL_NAME_SETTING=.*/CHANNEL_NAME_SETTING=/' .env
          sed -i 's/^CHANNEL_NAME_MODEL_EVENT=.*/CHANNEL_NAME_MODEL_EVENT=/' .env
          sed -i 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=/' .env
          # Redis isolation: use DB index 15 for tests to avoid clobbering
          sed -i 's/^REDIS_DB=.*/REDIS_DB=15/' .env
          # MeiliSearch isolation: disable Scout for unit/coverage tests
          echo "SCOUT_DRIVER=null" >> .env

      - name: Cache Laravel bootstrap files
        run: |
          php artisan storage:link --force
          php artisan route:cache
          php artisan view:cache
          php artisan icons:cache
          php artisan filament:cache-components

      - name: Wait for MySQL and migrate
        run: |
          for i in $(seq 1 60); do
            nc -z 127.0.0.1 3306 && break
            sleep 1
          done
          nc -z 127.0.0.1 3306 || { echo "MySQL did not become ready in time"; exit 1; }
          php artisan migrate:fresh --seed --force
          # Create isolated unit test database to prevent tests from
          # truncating tables in the seed database. The name carries the
          # "testing" marker required by DestructiveEnvironmentGuard.
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS nexusphp_unit_testing CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON nexusphp_unit_testing.* TO 'nexusphp'@'%'; FLUSH PRIVILEGES;"
          # Copy schema + seed data for tables tests depend on (settings, users)
          mysqldump -h 127.0.0.1 -u root -proot --no-data --skip-comments --set-gtid-purged=OFF --single-transaction nexusphp | mysql -h 127.0.0.1 -u root -proot nexusphp_unit_testing
          mysqldump -h 127.0.0.1 -u root -proot --no-create-info --skip-comments --set-gtid-purged=OFF --single-transaction nexusphp settings users | mysql -h 127.0.0.1 -u root -proot nexusphp_unit_testing

      - name: Run PHPUnit unit tests
        run: DB_DATABASE=nexusphp_unit_testing vendor/bin/phpunit --testsuite Unit --no-coverage

      - name: Run architecture ratchet tests
        if: matrix.php == '8.5' && matrix.mysql == '9.0'
        run: DB_DATABASE=nexusphp_unit_testing vendor/bin/phpunit --testsuite Architecture --no-coverage

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexusphp
          MYSQL_USER: nexusphp
          MYSQL_PASSWORD: nexusphp
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, gd, gmp, intl, json, mbstring, mysqli, pdo, pdo_mysql, redis, sqlite3, xml, zip
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Dump autoload
        run: composer dump-autoload --no-interaction --no-scripts

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=nexusphp/' .env
          sed -i 's/^CACHE_DRIVER=.*/CACHE_DRIVER=array/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          sed -i 's/^CHANNEL_NAME_SETTING=.*/CHANNEL_NAME_SETTING=/' .env
          sed -i 's/^CHANNEL_NAME_MODEL_EVENT=.*/CHANNEL_NAME_MODEL_EVENT=/' .env
          sed -i 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=/' .env
          # Redis isolation: use DB index 15 for tests to avoid clobbering
          sed -i 's/^REDIS_DB=.*/REDIS_DB=15/' .env
          # MeiliSearch isolation: disable Scout for unit/coverage tests
          echo "SCOUT_DRIVER=null" >> .env

      - name: Wait for MySQL and migrate
        run: |
          for i in $(seq 1 60); do
            nc -z 127.0.0.1 3306 && break
            sleep 1
          done
          nc -z 127.0.0.1 3306 || { echo "MySQL did not become ready in time"; exit 1; }
          php artisan migrate:fresh --seed --force
          # Create isolated test databases for Unit and Feature suites.
          # Separate databases allow the two suites to run with independent
          # fixtures and prevent any risk of cross-suite data interference.
          # Both names carry the "testing" marker required by
          # DestructiveEnvironmentGuard.
          mysql -h 127.0.0.1 -u root -proot -e "
            CREATE DATABASE IF NOT EXISTS nexusphp_unit_testing CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE IF NOT EXISTS nexusphp_feature_testing CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            GRANT ALL PRIVILEGES ON nexusphp_unit_testing.* TO 'nexusphp'@'%';
            GRANT ALL PRIVILEGES ON nexusphp_feature_testing.* TO 'nexusphp'@'%';
            FLUSH PRIVILEGES;
          "
          # Copy schema to both test databases
          for db in nexusphp_unit_testing nexusphp_feature_testing; do
            mysqldump -h 127.0.0.1 -u root -proot --no-data --skip-comments --set-gtid-purged=OFF --single-transaction nexusphp | mysql -h 127.0.0.1 -u root -proot "$db"
          done
          # Unit tests need: settings, users
          mysqldump -h 127.0.0.1 -u root -proot --no-create-info --skip-comments --set-gtid-purged=OFF --single-transaction nexusphp settings users | mysql -h 127.0.0.1 -u root -proot nexusphp_unit_testing
          # Feature tests need: settings/users — config + auth, searchbox/searchbox_fields — browse mode,
          # categories — torrent listing, agent_allowed_family/agent_allowed_exception — announce client check
          mysqldump -h 127.0.0.1 -u root -proot --no-create-info --skip-comments --set-gtid-purged=OFF --single-transaction nexusphp settings users searchbox searchbox_fields categories agent_allowed_family agent_allowed_exception | mysql -h 127.0.0.1 -u root -proot nexusphp_feature_testing

      - name: Run PHPUnit Unit with coverage
        run: DB_DATABASE=nexusphp_unit_testing vendor/bin/phpunit --testsuite Unit --coverage-clover=coverage-unit.xml

      - name: Run PHPUnit Feature with coverage
        run: DB_DATABASE=nexusphp_feature_testing vendor/bin/phpunit --testsuite Feature --coverage-clover=coverage-feature.xml --coverage-html=coverage-html

      - name: Upload coverage to Codecov (Unit + Feature flags)
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        continue-on-error: true
        with:
          files: ./coverage-unit.xml,./coverage-feature.xml
          flags: unit,feature
          # T-16: Patch coverage target — 60% of new/changed lines must
          # be covered. Codecov enforces this server-side when configured
          # in codecov.yml. The token is needed for patch coverage to work.
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Minimum coverage gate (Unit ≥ 35%)
        # W0-04: Fail-closed coverage gate.
        # Reads line coverage from Clover XML files already generated
        # by the Unit and Feature steps above — no test re-runs.
        # Fails on missing files, parse errors, or Unit coverage below floor.
        # Only Unit coverage is gated — Feature coverage is informational
        # since feature tests require full infrastructure and naturally
        # have lower coverage.
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          UNIT_THRESHOLD = 35.0
          files = ["coverage-unit.xml", "coverage-feature.xml"]
          per_file = {}

          for f in files:
              p = Path(f)
              if not p.exists():
                  print(f"::error::Coverage file not found: {f}")
                  sys.exit(1)
              try:
                  tree = ET.parse(f)
                  root = tree.getroot()
                  # Clover <metrics> attributes: statements, coveredstatements
                  # Use project-level metrics for aggregate counts
                  metrics = root.find(".//project/metrics")
                  if metrics is None:
                      metrics = root.find(".//metrics")
                  if metrics is None:
                      print(f"::error::No <metrics> element in {f}")
                      sys.exit(1)
                  stmts = int(metrics.get("statements", "0"))
                  covered = int(metrics.get("coveredstatements", "0"))
              except ET.ParseError as e:
                  print(f"::error::Failed to parse {f}: {e}")
                  sys.exit(1)
              except (TypeError, ValueError) as e:
                  print(f"::error::Invalid metrics in {f}: {e}")
                  sys.exit(1)
              per_file[f] = (stmts, covered)

          print(f"## Coverage gate" )
          print(f"| Suite | Statements | Covered | % |")
          print(f"|---|---:|---:|---:|")
          for f, (s, c) in per_file.items():
              fp = (c / s * 100) if s > 0 else 0.0
              print(f"| {f} | {s} | {c} | {fp:.2f}% |")

          unit_stmts, unit_covered = per_file["coverage-unit.xml"]
          unit_pct = (unit_covered / unit_stmts * 100) if unit_stmts > 0 else 0.0
          print(f"\nUnit threshold: {UNIT_THRESHOLD:.0f}%  Unit coverage: {unit_pct:.2f}%")
          if unit_pct < UNIT_THRESHOLD:
              print(f"::error::Unit coverage {unit_pct:.2f}% is below threshold {UNIT_THRESHOLD:.0f}%")
              sys.exit(1)
          print("Coverage gate passed.")
          PYEOF

      - name: Upload HTML coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-html
          path: coverage-html
          retention-days: 14

      - name: Generate app() usage report (W2-01)
        run: php artisan app:usage-report --top=20 --output=app-usage-report.md
        continue-on-error: true

      - name: Upload app() usage report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: app-usage-report
          path: app-usage-report.md
          retention-days: 30

  smoke-test:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: [static-analysis, unit-tests, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, gd, gmp, intl, json, mbstring, mysqli, pdo, pdo_mysql, redis, sqlite3, xml, zip
          coverage: none

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's|DB_HOST=127.0.0.1|DB_HOST=mysql|g' .env
          sed -i 's|REDIS_HOST=127.0.0.1|REDIS_HOST=redis|g' .env
          sed -i 's|LOG_FILE=.*|LOG_FILE=php://stdout|g' .env
          # .env.example uses a placeholder DB_PASSWORD — set the real value
          # to match the MySQL service container.
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=nexusphp/' .env
          # .env.example leaves MEILISEARCH_MASTER_KEY empty so users must set
          # their own. For the smoke-test stack, restore the compose default.
          sed -i 's|^MEILISEARCH_MASTER_KEY=.*|MEILISEARCH_MASTER_KEY=nexusphp_default_key|' .env
          # Use an isolated E2E testing database so Feature tests (including
          # CriticalPathTest) never mutate the dev/production database.
          # The MySQL container creates this DB automatically via
          # MYSQL_DATABASE in docker-compose.yml. The name carries the
          # "testing" marker required by DestructiveEnvironmentGuard.
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=nexusphp_e2e_testing/' .env
          # Use dev overrides (bind-mounts, openresty config mounts)
          echo "COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml" >> "$GITHUB_ENV"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Dump autoload
        run: composer dump-autoload --no-interaction --no-scripts

      - name: Build Docker images
        run: docker compose build

      - name: Start core services and wait
        run: docker compose up -d --wait mysql redis php

      - name: Install database
        run: docker compose exec -T php php artisan migrate:fresh --seed --force

      - name: Start remaining services and wait
        run: docker compose up -d --wait

      - name: Cache Laravel bootstrap files
        run: |
          docker compose exec -T php php artisan storage:link --force
          docker compose exec -T php php artisan route:cache
          docker compose exec -T php php artisan view:cache
          docker compose exec -T php php artisan icons:cache
          docker compose exec -T php php artisan filament:cache-components

      - name: Smoke test public pages
        run: |
          set -e
          for page in /index /login /signup /torrents /topten; do
            echo "Testing $page"
            curl -sfL --max-time 10 "http://localhost$page" -o /dev/null
          done

      - name: Clear any stale Laravel config cache
        run: docker compose exec -T php php artisan config:clear

      - name: Import MeiliSearch index
        run: docker compose exec -T php php artisan meilisearch:import

      - name: Run Feature tests
        run: |
          # Flush Redis to clear any cached settings from migrate:fresh
          source .env 2>/dev/null
          docker compose exec -T redis sh -c "redis-cli -a \"\${REDIS_PASSWORD:-}\" FLUSHALL" 2>/dev/null || true
          # Feature tests use the isolated E2E database (nexusphp_e2e_testing),
          # same as the OpenResty/PHP-FPM stack. CriticalPathTest reads
          # E2E_DB_DATABASE to match the connection used by HTTP requests.
          docker compose exec -T \
            -e CRITICAL_PATH_BASE_URL=http://openresty \
            -e DB_DATABASE=nexusphp_e2e_testing \
            -e E2E_DB_DATABASE=nexusphp_e2e_testing \
            php vendor/bin/phpunit --testsuite Feature --no-coverage

  codeql:
    name: CodeQL security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep-blocking:
    name: Semgrep blocking rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Semgrep
        run: pip install semgrep==1.89.0

      - name: Run blocking Semgrep rules
        run: |
          set -euo pipefail
          semgrep scan --config .semgrep.blocking.yml --sarif --output semgrep-blocking-results.sarif
          echo "## Semgrep blocking results" >> "$GITHUB_STEP_SUMMARY"
          echo "0 blocking findings — all clear." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload blocking results to GitHub Security
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        with:
          sarif_file: semgrep-blocking-results.sarif

  semgrep-informational:
    name: Semgrep informational rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Semgrep
        run: pip install semgrep==1.89.0

      - name: Run informational Semgrep rules
        id: semgrep-info
        run: |
          set -euo pipefail
          semgrep scan --config .semgrep.informational.yml --sarif --output semgrep-info-results.sarif --json > semgrep-info.json 2>/dev/null || true
          if [ ! -s semgrep-info.json ]; then
            echo '{"results":[]}' > semgrep-info.json
          fi
          if [ ! -f semgrep-info-results.sarif ]; then
            echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"Semgrep","informationUri":"https://semgrep.dev","rules":[]}},"results":[]}]}' > semgrep-info-results.sarif
          fi
          TOTAL=$(python3 -c "import json; print(json.load(open('semgrep-info.json'))['results'].__len__())")
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          {
            echo "## Semgrep informational results"
            echo "Total findings: **$TOTAL**"
            echo ""
            echo "| Rule | Count |"
            echo "|---|---:|"
            python3 -c "
          import json
          from collections import Counter
          d = json.load(open('semgrep-info.json'))
          c = Counter(r['check_id'] for r in d['results'])
          for k, v in sorted(c.items()):
              print(f'| {k} | {v} |')
          "
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compare with baseline
        run: |
          set -euo pipefail
          CURRENT=${{ steps.semgrep-info.outputs.total }}
          BASELINE=$(python3 -c "import json; print(json.load(open('.semgrep-baseline.json'))['total'])")
          echo "Current: $CURRENT  Baseline: $BASELINE"
          if [ "$CURRENT" -gt "$BASELINE" ]; then
            echo "::error::Semgrep informational findings increased: $CURRENT > $BASELINE (baseline). Fix new findings or update baseline with justification."
            exit 1
          fi
          echo "Findings within baseline ($CURRENT <= $BASELINE)."

      - name: Upload informational results to GitHub Security
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        with:
          sarif_file: semgrep-info-results.sarif

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Dependency review
        uses: actions/dependency-review-action@05fe4576374b728f0c523d6a13d64c25081e0803 # v4.8.3
        continue-on-error: true
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # Block GPL-incompatible licenses in production dependencies.
          # tracker-lp-bits is GPL-2.0-only — allow GPL-2.0-compatible licenses.
          deny-licenses: AGPL-3.0,AGPL-3.0-only,AGPL-3.0-or-later,Apache-2.0,BSD-4-Clause,CC-BY-NC-1.0,CC-BY-NC-2.0,CC-BY-NC-2.5,CC-BY-NC-3.0,CC-BY-NC-4.0,CC-BY-NC-ND-1.0,CC-BY-NC-ND-2.0,CC-BY-NC-ND-2.5,CC-BY-NC-ND-3.0,CC-BY-NC-ND-4.0,CC-BY-NC-SA-1.0,CC-BY-NC-SA-2.0,CC-BY-NC-SA-2.5,CC-BY-NC-SA-3.0,CC-BY-NC-SA-4.0,MS-RL

  container-scan:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's|DB_HOST=127.0.0.1|DB_HOST=mysql|g' .env
          sed -i 's|REDIS_HOST=127.0.0.1|REDIS_HOST=redis|g' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=nexusphp/' .env
          sed -i 's|^MEILISEARCH_MASTER_KEY=.*|MEILISEARCH_MASTER_KEY=nexusphp_default_key|' .env
          echo "COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml" >> "$GITHUB_ENV"

      - name: Build Docker images
        run: docker compose build php openresty

      - name: Validate .trivyignore entries
        run: |
          set -euo pipefail
          if [ ! -f .trivyignore ]; then
            echo "No .trivyignore file — nothing to validate."
            exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          ERRORS=0
          CVE=""
          while IFS= read -r line; do
            # Skip empty lines and full-line comments
            case "$line" in
              ""|"#"*) continue ;;
            esac
            if echo "$line" | grep -qE '^CVE-[0-9]'; then
              CVE="$line"
            elif echo "$line" | grep -qE '^# expires:'; then
              if [ -z "$CVE" ]; then
                echo "::error::Expiry comment without preceding CVE ID: $line"
                ERRORS=$((ERRORS + 1))
                continue
              fi
              EXPIRY=$(echo "$line" | sed -nE 's/^# expires: ([0-9]{4}-[0-9]{2}-[0-9]{2}).*/\1/p')
              if [ -z "$EXPIRY" ]; then
                echo "::error::Missing expiry date for $CVE: $line"
                ERRORS=$((ERRORS + 1))
              elif [ "$EXPIRY" \< "$TODAY" ]; then
                echo "::error::Expired .trivyignore entry: $CVE (expired $EXPIRY). Remove or update."
                ERRORS=$((ERRORS + 1))
              else
                echo "OK: $CVE expires $EXPIRY"
              fi
              CVE=""
            fi
          done < .trivyignore
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::$ERRORS invalid or expired .trivyignore entries found."
            exit 1
          fi
          echo "All .trivyignore entries are valid and not expired."

      - name: Run Trivy on PHP image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: nexusphp_php:latest
          format: sarif
          output: trivy-php-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          trivyignores: .trivyignore
          version: v0.74.0

      - name: Run Trivy on OpenResty image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: nexusphp_openresty:latest
          format: sarif
          output: trivy-openresty-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          trivyignores: .trivyignore
          version: v0.74.0

      - name: Check Trivy results for actionable vulnerabilities
        run: |
          set -euo pipefail
          # Trivy exit-code is 0 because rejected CVEs (e.g. CVE-2026-80256)
          # cause Trivy to crash with "no vulnerability details" even when
          # listed in .trivyignore. Instead, we parse the SARIF output and
          # fail only if there are CRITICAL/HIGH results not in .trivyignore.
          IGNORED=$(grep -E '^CVE-[0-9]' .trivyignore | sort -u || true)
          echo "Ignored CVEs: $IGNORED"
          for sarif in trivy-php-results.sarif trivy-openresty-results.sarif; do
            if [ ! -f "$sarif" ]; then
              echo "WARN: $sarif not found, skipping"
              continue
            fi
            RESULTS=$(python3 -c "
          import json, sys
          with open('$sarif') as f:
            data = json.load(f)
          for run in data.get('runs', []):
            for result in run.get('results', []):
              rule_id = result.get('ruleId', '')
              level = result.get('level', '')
              if level in ('error', 'warning'):
                print(f'{rule_id}|{level}')
          " || true)
            if [ -z "$RESULTS" ]; then
              echo "OK: no actionable vulnerabilities in $sarif"
              continue
            fi
            FAILED=0
            while IFS='|' read -r cve level; do
              if echo "$IGNORED" | grep -q "^${cve}$"; then
                echo "SKIP: $cve is in .trivyignore"
              else
                echo "::error::Unignored vulnerability: $cve ($level) in $sarif"
                FAILED=$((FAILED + 1))
              fi
            done <<< "$RESULTS"
            if [ "$FAILED" -gt 0 ]; then
              exit 1
            fi
          done
          echo "All Trivy results within policy."

      - name: Upload Trivy PHP scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        with:
          sarif_file: trivy-php-results.sarif
          category: trivy-php

      - name: Upload Trivy OpenResty scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        with:
          sarif_file: trivy-openresty-results.sarif
          category: trivy-openresty

  sbom:
    name: SBOM generation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, gd, gmp, intl, json, mbstring, mysqli, pdo, pdo_mysql, redis, sqlite3, xml, zip
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Generate Composer SBOM (CycloneDX)
        run: |
          composer config --no-interaction allow-plugins.cyclonedx/cyclonedx-php-composer true
          composer require --dev cyclonedx/cyclonedx-php-composer:^5 --no-interaction --no-scripts
          composer CycloneDX:make-sbom --output-format=Json --output-file=composer-sbom.json --omit=dev
          echo "Composer SBOM generated: composer-sbom.json"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Generate npm SBOM (CycloneDX)
        run: |
          npx @cyclonedx/cyclonedx-npm --output-file=npm-sbom.json --omit dev
          echo "npm SBOM generated: npm-sbom.json"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sbom
          path: |
            composer-sbom.json
            npm-sbom.json
          retention-days: 30

  cosign:
    name: Cosign keyless signing
    runs-on: ubuntu-latest
    needs: [smoke-test, container-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/php8'
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's|DB_HOST=127.0.0.1|DB_HOST=mysql|g' .env
          sed -i 's|REDIS_HOST=127.0.0.1|REDIS_HOST=redis|g' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=nexusphp/' .env
          sed -i 's|^MEILISEARCH_MASTER_KEY=.*|MEILISEARCH_MASTER_KEY=nexusphp_default_key|' .env
          echo "COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml" >> "$GITHUB_ENV"

      - name: Build Docker images
        run: docker compose build php openresty

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Keyless signing of PHP image
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' nexusphp_php:latest 2>/dev/null | sed 's/.*@//')
          if [ -z "$digest" ]; then
            # Image has no repo digest (not pushed to registry).
            # Tag it as local and sign the local reference.
            docker tag nexusphp_php:latest "ghcr.io/${{ github.repository }}/php:latest"
            digest=$(docker inspect --format='{{json .RepoTags}}' nexusphp_php:latest)
            echo "No registry digest — signing attestation only"
          fi
          # Sign the image using keyless signing (OIDC token from GitHub Actions)
          cosign sign --yes nexusphp_php:latest

      - name: Keyless signing of OpenResty image
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes nexusphp_openresty:latest

      - name: Attach SBOM attestation to PHP image
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          if [ -f composer-sbom.json ]; then
            cosign attest --yes --predicate composer-sbom.json --type cyclonedx nexusphp_php:latest
          fi

  infection:
    name: Mutation testing (Infection)
    runs-on: ubuntu-latest
    needs: [coverage]
    # T-16: Mutation testing for critical paths: Auth, Token, Bonus, Tracker,
    # Outbox, Policies, Torrent/Thanks mutations.
    # Runs only on push to php8 (not PRs) to keep PR CI fast.
    if: github.event_name == 'push' && github.ref == 'refs/heads/php8'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, gd, gmp, intl, json, mbstring, mysqli, pdo, pdo_mysql, redis, sqlite3, xml, zip
          coverage: xdebug
          ini-values: memory_limit=2G

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Infection (full scope)
        run: |
          vendor/bin/infection \
            --configuration=infection.json5 \
            --threads=4 \
            --min-msi=40 \
            --min-covered-msi=50 \
            --no-progress \
            --logger-github

      - name: Upload Infection logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: infection-logs
          path: |
            infection.log
            infection-summary.log
          retention-days: 14

  infection-pr:
    name: Mutation testing (PR scope)
    runs-on: ubuntu-latest
    needs: [coverage]
    # W3-04: Run Infection only on changed critical files in PRs.
    # Full-scope mutation testing runs on push to php8 (see infection job).
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, gd, gmp, intl, json, mbstring, mysqli, pdo, pdo_mysql, redis, sqlite3, xml, zip
          coverage: xdebug
          ini-values: memory_limit=2G

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Detect changed critical files
        id: changed
        run: |
          # Get changed files in app/ that are in the Infection source scope
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- \
            'app/Http/Controllers/AuthenticateController.php' \
            'app/Http/Controllers/TokenController.php' \
            'app/Services/Announce/*.php' \
            'app/Services/BonusService.php' \
            'app/Services/AttachmentMutationService.php' \
            'app/Services/OutboxService.php' \
            'app/Services/OutboxDispatcher.php' \
            'app/Services/ThankService.php' \
            'app/Services/TorrentBookmarkService.php' \
            'app/Policies/TorrentPolicy.php' \
            'app/Policies/UserPolicy.php' \
            'app/Policies/UsercpPolicy.php' \
            'app/Policies/TopicPolicy.php' \
            'app/Policies/PostPolicy.php' \
            'app/Policies/MessagePolicy.php' \
            | grep -v '^$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No critical files changed — skipping mutation testing."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Changed critical files:"
            echo "$CHANGED_FILES"
            # Build --filter argument for Infection
            FILTER=$(echo "$CHANGED_FILES" | sed 's|^app/||' | tr '\n' ',' | sed 's/,$//')
            echo "filter=$FILTER" >> $GITHUB_OUTPUT
          fi

      - name: Run Infection (changed files only)
        if: steps.changed.outputs.skip != 'true'
        run: |
          # Run Infection with --filter to limit to changed files
          # --ignore-msi-errors allows PR runs to show results without failing
          # on threshold (full-scope run on push enforces thresholds)
          vendor/bin/infection \
            --configuration=infection.json5 \
            --threads=4 \
            --no-progress \
            --ignore-msi-errors \
            --logger-github \
            --filter="${{ steps.changed.outputs.filter }}"

      - name: Upload Infection PR logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.changed.outputs.skip != 'true'
        with:
          name: infection-pr-logs
          path: |
            infection.log
            infection-summary.log
          retention-days: 14

  prod-compose-smoke:
    name: Production Compose smoke test
    runs-on: ubuntu-latest
    needs: [smoke-test]
    # W8-01: Build the production image and verify the full prod stack
    # starts cleanly from scratch with named volumes, read-only rootfs,
    # non-root UID, and all required services.
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's|DB_HOST=127.0.0.1|DB_HOST=mysql|g' .env
          sed -i 's|REDIS_HOST=127.0.0.1|REDIS_HOST=redis|g' .env
          sed -i 's|LOG_FILE=.*|LOG_FILE=php://stdout|g' .env
          # Use a non-default password — validate-production rejects defaults
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=prod_test_strong_pass_2026/' .env
          sed -i 's|^MEILISEARCH_MASTER_KEY=.*|MEILISEARCH_MASTER_KEY=nexusphp_default_key|' .env
          # Use an isolated testing database (DestructiveEnvironmentGuard requires "test")
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=nexusphp_e2e_testing/' .env
          # Production environment settings required by validate-production
          sed -i 's/^APP_ENV=.*/APP_ENV=production/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          sed -i 's/^SESSION_SECURE_COOKIE=.*/SESSION_SECURE_COOKIE=true/' .env
          # Generate APP_KEY — required by validate-production
          # (can't use artisan key:generate without composer install on host)
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> .env
          # Use production overrides (read-only rootfs, named volumes, prod image)
          echo "COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml" >> "$GITHUB_ENV"

      - name: Build production Docker image
        run: docker compose build php

      - name: Start core services and wait
        run: docker compose up -d --wait mysql redis php

      - name: Debug PHP container logs (on failure)
        if: failure()
        run: |
          echo "=== PHP container logs ==="
          docker compose logs php 2>&1 || true
          echo "=== PHP container status ==="
          docker compose ps -a php 2>&1 || true

      - name: Install database
        run: docker compose exec -T php php artisan migrate:fresh --seed --force

      - name: Start remaining services and wait
        run: docker compose up -d --wait

      - name: Debug all container logs (on failure)
        if: failure()
        run: |
          echo "=== All containers ==="
          docker compose ps -a 2>&1 || true
          for svc in php openresty queue scheduler meilisearch; do
            echo "=== $svc logs ==="
            docker compose logs --tail=50 $svc 2>&1 || true
          done

      - name: Verify PHP health
        run: |
          # PHP-FPM must respond to a basic artisan command
          docker compose exec -T php php artisan about --no-interaction

      - name: Verify non-root UID
        run: |
          uid=$(docker compose exec -T php id -u)
          if [ "$uid" = "0" ]; then
            echo "FAIL: PHP container running as root (uid=0)"
            exit 1
          fi
          echo "OK: PHP container running as uid=$uid"

      - name: Verify read-only rootfs
        run: |
          # Writing to rootfs (outside writable volumes) must fail
          if docker compose exec -T php sh -c 'echo test > /var/www/html/test_write 2>/dev/null'; then
            echo "FAIL: rootfs is writable"
            exit 1
          fi
          echo "OK: rootfs is read-only"

      - name: Verify writable storage volume
        run: |
          docker compose exec -T php sh -c 'echo test > /var/www/html/storage/framework/cache/test_write && rm /var/www/html/storage/framework/cache/test_write'
          echo "OK: storage volume is writable"

      - name: Verify writable attachments volume
        run: |
          docker compose exec -T php sh -c 'echo test > /var/www/html/attachments/test_write && rm /var/www/html/attachments/test_write'
          echo "OK: attachments volume is writable"

      - name: Verify writable torrents volume
        run: |
          docker compose exec -T php sh -c 'echo test > /var/www/html/torrents/test_write && rm /var/www/html/torrents/test_write'
          echo "OK: torrents volume is writable"

      - name: Verify Vite assets and manifest exist
        run: |
          docker compose exec -T php sh -c 'test -f /var/www/html/public/build/manifest.json || test -f /var/www/html/public/build/.vite/manifest.json'
          echo "OK: Vite manifest exists in public/build"

      - name: Verify static files in public/build
        run: |
          # At least one CSS or JS asset should exist
          docker compose exec -T php sh -c 'ls /var/www/html/public/build/assets/ | head -1 | grep -q .'
          echo "OK: static assets exist in public/build/assets/"

      - name: Verify route/config/view caches
        run: |
          # Laravel 13 uses routes-v7.php (new route caching format)
          docker compose exec -T php sh -c 'test -f /var/www/html/bootstrap/cache/routes-v7.php'
          docker compose exec -T php sh -c 'test -f /var/www/html/bootstrap/cache/config.php'
          # view:cache compiles templates to storage/framework/views/, not a single file
          docker compose exec -T php sh -c 'test -d /var/www/html/storage/framework/views && [ "$(ls -A /var/www/html/storage/framework/views/)" ]'
          echo "OK: route/config/view caches exist"

      - name: Verify DB connectivity
        run: |
          # tinker is dev-only; use migrate:status which always works
          docker compose exec -T php php artisan migrate:status --no-interaction >/dev/null 2>&1
          echo "OK: DB connectivity verified"

      - name: Verify Redis connectivity
        run: |
          # Redis container health is verified by --wait (healthcheck uses
          # redis-cli with auth). Verify the container is healthy.
          docker compose ps redis --format '{{.Status}}' | grep -qi "healthy\|up"
          echo "OK: Redis connectivity verified"

      - name: Verify MeiliSearch connectivity
        run: |
          # Use curl to check MeiliSearch health endpoint
          docker compose exec -T php sh -c 'curl -sf http://${MEILISEARCH_HOST:-meilisearch}:7700/health 2>/dev/null'
          echo ""
          echo "OK: MeiliSearch connectivity verified"

      - name: Verify queue worker is running
        run: |
          # Queue container should be up and horizon should report active
          status=$(docker compose exec -T queue php artisan horizon:status 2>&1)
          echo "Horizon status: $status"
          echo "$status" | grep -q "running\|active" || \
            (echo "FAIL: horizon not running"; exit 1)
          echo "OK: queue worker (horizon) is running"

      - name: Verify scheduler heartbeat
        run: |
          # Scheduler container should be running and cycling
          docker compose ps scheduler --format '{{.Status}}' | grep -q "Up\|running"
          echo "OK: scheduler container is up"

      - name: Verify OpenResty config is valid
        run: |
          docker compose exec -T openresty openresty -t 2>&1 | grep -q "syntax is ok\|test is successful"
          echo "OK: OpenResty config is valid"

      - name: Smoke test public pages via OpenResty
        run: |
          set -e
          for page in / /login /signup; do
            echo "Testing $page"
            status=$(curl -sL --max-time 10 -o /dev/null -w "%{http_code}" "http://localhost${page}")
            echo "  Status: $status"
            # Accept 200-399 (200 OK, 302 redirect to login, etc.)
            if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
              echo "  OK"
            else
              echo "  FAIL: unexpected status $status"
              exit 1
            fi
          done
          echo "OK: public pages respond via OpenResty"

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
