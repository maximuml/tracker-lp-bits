name: deploy to demo site
on:
  push:
    branches: [ "php8" ]

# Environment variables available to all jobs and steps in this workflow
env:
  SSH_KEY: ${{secrets.DEMO_SSH_KEY}}
  SSH_USER: ${{secrets.DEMO_SSH_USER}}
  SSH_HOST: ${{secrets.DEMO_SSH_HOST}}
  DEMO_WEB_ROOT: ${{secrets.DEMO_WEB_ROOT}}
  SSH_HOST_KEY: ${{secrets.DEMO_SSH_HOST_KEY}}
  DEMO_HEALTH_URL: ${{secrets.DEMO_HEALTH_URL}}
permissions:
  contents: read
concurrency:
  group: demo-deploy
  cancel-in-progress: false
jobs:
  login-to-demo-and-up:
    name: Login to demo and Deploy
    runs-on: ubuntu-latest
    environment: production
    # Skip when demo secrets are not configured — avoids red check on
    # forks and repos without a demo server. T-15 will switch this to
    # workflow_dispatch only.
    if: ${{ secrets.DEMO_SSH_KEY != '' && secrets.DEMO_SSH_HOST != '' }}
    steps:
    # Prepare
    - name: Prepare user key
      run: |
        mkdir -p ~/.ssh/
        echo "$SSH_KEY" > ~/.ssh/demo.key
        chmod 600 ~/.ssh/demo.key
        # Trust the demo host key explicitly (pinned in repo secrets).
        # Avoids MITM risk of StrictHostKeyChecking=no.
        mkdir -p ~/.ssh/
        echo "$SSH_HOST_KEY" >> ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts
        cat >> ~/.ssh/config <<END
        Host demo
          HostName $SSH_HOST
          User $SSH_USER
          IdentityFile ~/.ssh/demo.key
          StrictHostKeyChecking yes
          UserKnownHostsFile ~/.ssh/known_hosts
        END

    # Pre-deploy: record current commit for rollback
    - name: Record current commit (for rollback)
      run: |
        ssh demo "cd $DEMO_WEB_ROOT && git rev-parse HEAD" > /tmp/previous-commit.txt
        echo "Previous commit: $(cat /tmp/previous-commit.txt)"

    # Pre-deploy: check migration readiness
    - name: Check migration readiness
      run: |
        ssh demo "cd $DEMO_WEB_ROOT && php artisan nexus:update --tag=dev"

    # Deploy
    - name: Run migrations and update
      run: |
        ssh demo "cd $DEMO_WEB_ROOT && php artisan nexus:update"

    # Post-deploy: health check
    - name: Health check (liveness)
      run: |
        for i in $(seq 1 10); do
          HTTP_CODE=$(curl -sfL --max-time 10 -o /dev/null -w "%{http_code}" "${DEMO_HEALTH_URL:-https://example.com}/health/live" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Health check passed (HTTP $HTTP_CODE)"
            exit 0
          fi
          echo "Health check attempt $i: HTTP $HTTP_CODE, retrying..."
          sleep 5
        done
        echo "::error::Health check failed after 10 attempts"
        exit 1

    # Post-deploy: readiness check (DB + Redis)
    - name: Readiness check (DB + Redis)
      run: |
        for i in $(seq 1 10); do
          HTTP_CODE=$(curl -sfL --max-time 15 -o /dev/null -w "%{http_code}" "${DEMO_HEALTH_URL:-https://example.com}/health/ready" 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Readiness check passed (HTTP $HTTP_CODE)"
            exit 0
          fi
          echo "Readiness check attempt $i: HTTP $HTTP_CODE, retrying..."
          sleep 5
        done
        echo "::error::Readiness check failed after 10 attempts — initiating rollback"
        # Rollback to previous commit
        PREVIOUS=$(cat /tmp/previous-commit.txt)
        echo "Rolling back to $PREVIOUS"
        ssh demo "cd $DEMO_WEB_ROOT && git checkout $PREVIOUS && php artisan nexus:update"
        exit 1

    # Post-deploy: verify login page
    - name: Verify login page
      run: |
        HTTP_CODE=$(curl -sfL --max-time 10 -o /dev/null -w "%{http_code}" "${DEMO_HEALTH_URL:-https://example.com}/login.php" 2>/dev/null || echo "000")
        if [ "$HTTP_CODE" != "200" ]; then
          echo "::error::Login page returned HTTP $HTTP_CODE"
          exit 1
        fi
        echo "Login page OK (HTTP $HTTP_CODE)"
