name: Performance budget

on:
  push:
    branches: [php8]
  pull_request:
    branches: [php8]

permissions:
  contents: read

concurrency:
  group: perf-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k6-baseline:
    name: k6 performance baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, gd, gmp, intl, json, mbstring, mysqli, pdo, pdo_mysql, redis, sqlite3, xml, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'

      - name: Install k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Dump autoload
        run: composer dump-autoload --no-interaction --no-scripts

      - name: Build and start Docker stack
        env:
          NP_PORT: '80'
          REDIS_PASSWORD: 'ci-redis-test-password'
          MEILISEARCH_MASTER_KEY: 'ci-meilisearch-test-key'
          DB_HOST: 'mysql'
          DB_PORT: '3306'
          DB_DATABASE: 'nexusphp_e2e_testing'
          DB_USERNAME: 'nexusphp'
          DB_PASSWORD: 'nexusphp'
          APP_NAME: 'NexusPHP'
          PUSHER_APP_KEY: ''
          PUSHER_APP_CLUSTER: ''
        run: |
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=nexusphp/' .env
          sed -i 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=ci-redis-test-password/' .env
          sed -i 's/^MEILISEARCH_MASTER_KEY=.*/MEILISEARCH_MASTER_KEY=ci-meilisearch-test-key/' .env
          # Use isolated E2E testing database (never the dev/production DB).
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=nexusphp_e2e_testing/' .env
          # Point DB/Redis at Docker service hostnames (not 127.0.0.1)
          sed -i 's/^DB_HOST=.*/DB_HOST=mysql/' .env
          sed -i 's/^REDIS_HOST=.*/REDIS_HOST=redis/' .env
          # Replace ${VAR} references that docker compose can't interpolate
          sed -i 's/\${DB_HOST}/mysql/g' .env
          sed -i 's/\${APP_NAME}/NexusPHP/g' .env
          sed -i 's/\${PUSHER_APP_KEY}//g' .env
          sed -i 's/\${PUSHER_APP_CLUSTER}//g' .env
          # Use dev overrides (bind-mounts, openresty config mounts)
          export COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml
          docker compose build
          # Start mysql + redis first, wait for them
          docker compose up -d --wait mysql redis
          # Start php (vendor/ already populated on host via bind-mount)
          docker compose up -d --wait php
          # Run migrations + seed (base seeders + T-17 perf dataset)
          docker compose exec -T php php artisan migrate:fresh --seed --force
          docker compose exec -T php php artisan db:seed --class=PerformanceTestDatasetSeeder --force
          docker compose exec -T php php artisan storage:link --force
          # Start openresty
          docker compose up -d openresty
          # Wait for openresty to serve /health/live
          echo "Waiting for OpenResty to serve requests..."
          for i in $(seq 1 30); do
            if curl -sfL http://127.0.0.1:80/health/live -o /dev/null 2>/dev/null; then
              echo "OpenResty ready after ${i}s"
              break
            fi
            sleep 2
          done
          # Final check
          curl -sfL http://127.0.0.1:80/health/live || (echo "::error::OpenResty not responding" && exit 1)

      - name: Extract passkey for tracker tests
        id: passkey
        run: |
          # T-17: Extract passkey from perf_user_1 for announce/scrape tests
          PASSKEY=$(docker compose exec -T php php artisan tinker --execute='echo App\Models\User::where("username","perf_user_1")->value("passkey") ?? "";' 2>/dev/null | tr -d '[:space:]')
          echo "Extracted passkey: ${PASSKEY:0:8}..."
          echo "passkey=$PASSKEY" >> "$GITHUB_OUTPUT"

      - name: Run k6 performance baseline (web UI)
        run: |
          k6 run --env BASE_URL=http://127.0.0.1:80 \
            --env USERNAME=perf_user_1 \
            --env PASSWORD=PerfTest2026! \
            tests/Performance/baseline.js

      - name: Run k6 tracker load test (announce + scrape)
        run: |
          k6 run --env BASE_URL=http://127.0.0.1:80 \
            --env PASSKEY=${{ steps.passkey.outputs.passkey }} \
            tests/Performance/announce.js
