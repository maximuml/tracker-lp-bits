# Base compose file — shared service definitions for all environments.
#
# Development:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Production:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# Dev-only services (phpMyAdmin) use the "debug" profile and are only started
# when explicitly requested: docker compose --profile debug up

services:
  php:
    build:
      dockerfile: .docker/php/Dockerfile
      args:
        NEXUSPHP_ENV: dev
    image: nexusphp_php
    container_name: nexusphp-php
    # php-fpm treats SIGQUIT as a graceful stop (finishes in-flight requests);
    # the default SIGTERM cuts them. SIGQUIT + grace window = drained shutdown.
    stop_signal: SIGQUIT
    stop_grace_period: 60s
    environment:
      SERVICE_NAME: php
      MEILISEARCH_HOST: ${MEILISEARCH_HOST:-meilisearch}
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?MEILISEARCH_MASTER_KEY is required}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/php-fpm.sock || test -f /run/php-fpm.pid || nc -z 127.0.0.1 9000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet
    restart: unless-stopped

  queue:
    image: nexusphp_php
    container_name: nexusphp-queue
    # The php:fpm base image sets STOPSIGNAL SIGQUIT (right for php-fpm,
    # wrong for artisan): Horizon only traps SIGTERM/SIGINT, so the image
    # default would be ignored and docker would SIGKILL after grace.
    stop_signal: SIGTERM
    # Horizon drains in-flight jobs on SIGTERM (fast_termination=false).
    # Grace must cover the longest non-maintenance supervisor timeout (120s)
    # or docker escalates to SIGKILL and in-flight jobs are requeued mid-run.
    stop_grace_period: 125s
    user: www-data
    environment:
      SERVICE_NAME: queue
      MEILISEARCH_HOST: ${MEILISEARCH_HOST:-meilisearch}
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?MEILISEARCH_MASTER_KEY is required}
    depends_on:
      php:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q 'running' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet
    restart: always

  scheduler:
    image: nexusphp_php
    container_name: nexusphp-scheduler
    # The php:fpm base image defaults to STOPSIGNAL SIGQUIT which artisan
    # does not trap — schedule:work must get SIGTERM to exit cleanly.
    stop_signal: SIGTERM
    # Grace covers a full schedule:run minute-cycle so a stop does not kill
    # cron work mid-flight (the entrypoint loops every 60s).
    stop_grace_period: 70s
    user: www-data
    environment:
      SERVICE_NAME: scheduler
      MEILISEARCH_HOST: ${MEILISEARCH_HOST:-meilisearch}
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?MEILISEARCH_MASTER_KEY is required}
    depends_on:
      php:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan schedule:list --no-interaction >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet
    restart: always

  openresty:
    build:
      dockerfile: .docker/openresty/Dockerfile
    image: nexusphp_openresty
    container_name: nexusphp-openresty
    # nginx treats SIGQUIT as graceful (finishes in-flight connections);
    # SIGTERM is a fast shutdown that drops keepalives mid-request.
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    environment:
      NP_DOMAIN: ${NP_DOMAIN:-localhost}
      NP_PORT: ${NP_PORT:-80}
    depends_on:
      php:
        condition: service_healthy
    command: ["/bin/sh", "/usr/local/bin/entrypoint.sh"]
    ports:
      - "${NP_PORT:-80}:${NP_PORT:-80}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sfL http://127.0.0.1:${NP_PORT:-80}/health/live -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet

  redis:
    # T-13: Digest-pinned for reproducible builds. Update via Renovate.
    image: redis:alpine@sha256:9c3ecc609a8087c0f11c494fefaf37a8f7bf9a967631d4a0da8967a9810be354
    container_name: nexusphp-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet

  mysql:
    # T-13: Digest-pinned for reproducible builds. Update via Renovate.
    image: mysql:9@sha256:313c76f59c62376fd26b78fc85169902ef10134996bbfc31200eb9c2ed7e802e
    container_name: nexusphp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_DATABASE: ${DB_DATABASE:-nexusphp}
      MYSQL_USER: ${DB_USERNAME:-nexusphp}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_PASSWORD:?DB_PASSWORD is required}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet

  meilisearch:
    # T-13: Digest-pinned for reproducible builds. Update via Renovate.
    image: getmeili/meilisearch:v1.53@sha256:81ffa96ce6e9a6769775d772742ed3da653ad34960cd6c3b43b98918c07db101
    container_name: nexusphp-meilisearch
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?MEILISEARCH_MASTER_KEY is required}
    volumes:
      - meilisearch-data:/meili_data
    ports:
      - "127.0.0.1:${MEILISEARCH_PORT:-7700}:7700"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health | grep -q available || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet

volumes:
  mysql-data:
  redis-data:
  meilisearch-data:

networks:
  appnet:
