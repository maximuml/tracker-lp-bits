name: CI

on:
  push:
    branches: ["php8"]
  pull_request:
    branches: ["php8"]

jobs:
  lint-and-validate:
    name: Lint PHP and validate composer
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexusphp
          MYSQL_USER: nexusphp
          MYSQL_PASSWORD: nexusphp
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, gd, gmp, intl, json, mbstring, mysqli, pdo, pdo_mysql, redis, sqlite3, xml, zip
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-reqs --no-scripts

      - name: Dump autoload
        run: composer dump-autoload --no-interaction --no-scripts

      - name: Audit composer dependencies
        run: composer audit

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/^CACHE_DRIVER=.*/CACHE_DRIVER=array/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          sed -i 's/^CHANNEL_NAME_SETTING=.*/CHANNEL_NAME_SETTING=/' .env
          sed -i 's/^CHANNEL_NAME_MODEL_EVENT=.*/CHANNEL_NAME_MODEL_EVENT=/' .env

      - name: Run PHP syntax lint
        run: |
          find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -not -path './.docker/*' \
            -not -path './public/vendor/*' \
            -not -path './storage/*' \
            -print0 | xargs -0 -n1 -P4 php -l

      - name: Run Laravel Pint
        run: vendor/bin/pint --test

      - name: Run PHPStan on all PHP files
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      - name: Run PHPStan level 5 on app/Support and app/Models
        run: vendor/bin/phpstan analyse -c phpstan.level5.neon --no-progress --memory-limit=2G

      - name: Run PHPStan level 5 on app/Console, app/Http, and app/Repositories
        run: vendor/bin/phpstan analyse -c phpstan.level5.app.neon --no-progress --memory-limit=2G

      - name: Run PHPStan level 6 on app/Support, app/Models, app/Console, app/Http, and app/Repositories
        run: vendor/bin/phpstan analyse -c phpstan.level6.neon --no-progress --memory-limit=2G

      - name: Run PHPStan level 7 on app/ and empty baseline
        run: vendor/bin/phpstan analyse -c phpstan.level7.neon --no-progress --memory-limit=2G

      - name: Run PHPStan level 8 on app/ and empty baseline
        run: vendor/bin/phpstan analyse -c phpstan.level8.neon --no-progress --memory-limit=2G

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Audit npm dependencies
        run: npm audit

      - name: Cache Laravel bootstrap files
        run: |
          php artisan storage:link --force
          php artisan route:cache
          php artisan view:cache
          php artisan icons:cache
          php artisan filament:cache-components

      - name: Wait for MySQL and migrate
        run: |
          for i in $(seq 1 60); do
            nc -z 127.0.0.1 3306 && break
            sleep 1
          done
          nc -z 127.0.0.1 3306 || { echo "MySQL did not become ready in time"; exit 1; }
          php artisan migrate:fresh --seed --force

      - name: Run PHPUnit unit tests
        run: vendor/bin/phpunit --testsuite Unit --no-coverage

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexusphp
          MYSQL_USER: nexusphp
          MYSQL_PASSWORD: nexusphp
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, gd, gmp, intl, json, mbstring, mysqli, pdo, pdo_mysql, redis, sqlite3, xml, zip
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-reqs --no-scripts

      - name: Dump autoload
        run: composer dump-autoload --no-interaction --no-scripts

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/^CACHE_DRIVER=.*/CACHE_DRIVER=array/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          sed -i 's/^CHANNEL_NAME_SETTING=.*/CHANNEL_NAME_SETTING=/' .env
          sed -i 's/^CHANNEL_NAME_MODEL_EVENT=.*/CHANNEL_NAME_MODEL_EVENT=/' .env

      - name: Wait for MySQL and migrate
        run: |
          for i in $(seq 1 60); do
            nc -z 127.0.0.1 3306 && break
            sleep 1
          done
          nc -z 127.0.0.1 3306 || { echo "MySQL did not become ready in time"; exit 1; }
          php artisan migrate:fresh --seed --force

      - name: Run PHPUnit with coverage
        run: vendor/bin/phpunit --testsuite Unit --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  smoke-test:
    name: Docker smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, gd, gmp, intl, json, mbstring, mysqli, pdo, pdo_mysql, redis, sqlite3, xml, zip
          coverage: none

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's|DB_HOST=127.0.0.1|DB_HOST=mysql|g' .env
          sed -i 's|REDIS_HOST=127.0.0.1|REDIS_HOST=redis|g' .env
          sed -i 's|LOG_FILE=.*|LOG_FILE=php://stdout|g' .env
          # .env.example leaves MEILISEARCH_MASTER_KEY empty so users must set
          # their own. For the smoke-test stack, restore the compose default.
          sed -i 's|^MEILISEARCH_MASTER_KEY=.*|MEILISEARCH_MASTER_KEY=nexusphp_default_key|' .env

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-reqs --no-scripts

      - name: Dump autoload
        run: composer dump-autoload --no-interaction --no-scripts

      - name: Build Docker images
        run: docker compose build

      - name: Start core services and wait
        run: docker compose up -d --wait mysql redis php

      - name: Install database
        run: docker compose exec -T php php artisan migrate:fresh --seed --force

      - name: Start remaining services and wait
        run: docker compose up -d --wait

      - name: Cache Laravel bootstrap files
        run: |
          docker compose exec -T php php artisan storage:link --force
          docker compose exec -T php php artisan route:cache
          docker compose exec -T php php artisan view:cache
          docker compose exec -T php php artisan icons:cache
          docker compose exec -T php php artisan filament:cache-components

      - name: Smoke test public pages
        run: |
          set -e
          for page in /index.php /login.php /signup.php /torrents.php /topten.php; do
            echo "Testing $page"
            curl -sfL --max-time 10 "http://localhost$page" -o /dev/null
          done

      - name: Clear any stale Laravel config cache
        run: docker compose exec -T php php artisan config:clear

      - name: Import MeiliSearch index
        run: docker compose exec -T php php artisan meilisearch:import

      - name: Run Feature tests
        run: |
          docker compose exec -T -e CRITICAL_PATH_BASE_URL=http://openresty php vendor/bin/phpunit --testsuite Feature --no-coverage
