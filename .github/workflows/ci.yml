name: CI

on:
  push:
    branches: ["php8"]
  pull_request:
    branches: ["php8"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Быстрый сюит без сервисных контейнеров: ни MySQL, ни Redis, ни MeiliSearch.
  # Это и есть смысл разделения tests/Unit — обратная связь за минуту вместо
  # 12 минут с migrate:fresh --seed. Если этот job начал требовать БД, значит
  # в tests/Unit просочился интеграционный тест: его ловит UnitSuiteIsolationTest,
  # но здесь падение будет раньше и очевиднее.
  unit-tests-fast:
    name: Unit tests (no services)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP stack
        uses: ./.github/actions/setup-php-stack

      - name: Prepare environment
        run: bash scripts/ci/env-unit-fast.sh

      - name: Run PHPUnit unit tests (no DB, no Redis, no MeiliSearch)
        run: DB_DATABASE=nexusphp_unit_testing vendor/bin/phpunit --testsuite Unit --no-coverage

  static-analysis:
    name: Lint + Pint + PHPStan L8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup PHP stack
        uses: ./.github/actions/setup-php-stack

      - name: Validate composer.json and composer.lock
        run: composer validate

      # Invalid workflow files surface as 0-job failed runs on every push
      # (see the `cancel-progress` bug fixed in W8-05) — lint them like code.
      - name: Lint GitHub Actions workflows
        run: bash scripts/ci/run-actionlint.sh

      - name: Audit composer dependencies
        run: composer audit

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Run PHP syntax lint
        run: bash scripts/ci/php-lint.sh

      - name: Run Laravel Pint
        run: vendor/bin/pint --test

      - name: Prepare environment for PHPStan
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run PHPStan level 8
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

  ratchets:
    name: Repo ratchets (raw SQL + supply chain)
    runs-on: ubuntu-latest
    # W8-05: new third-party material must not enter unpinned — actions by
    # SHA, base images by digest, tool packages by version, no runtime
    # downloads in entrypoints. Cheap grep gate, blocks every PR.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check raw SQL query count
        run: bash scripts/ci/raw-sql-ratchet.sh

      - name: Check supply-chain pins
        run: bash scripts/ci/check-supply-chain-pins.sh

  migrations:
    name: Migration upgrade (previous release → HEAD)
    runs-on: ubuntu-latest
    # W8-02: proves `php artisan migrate` upgrades a database left by the
    # previous release — schema parity with migrate:fresh, data-transform
    # correctness and duration on a production-like fixture volume.
    # PREVIOUS_RELEASE must be updated (and the snapshot regenerated) with
    # each tagged release — see release-notes.md.
    env:
      PREVIOUS_RELEASE: v2.0.1
      UPGRADE_DB: nexusphp_upgrade_testing
      FRESH_DB: nexusphp_fresh_testing

    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: nexusphp
          MYSQL_PASSWORD: nexusphp
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP stack
        uses: ./.github/actions/setup-php-stack

      - name: Prepare environment
        run: bash scripts/ci/env-ci-services.sh

      - name: Wait for MySQL
        run: bash scripts/ci/wait-mysql.sh

      - name: Load previous-release schema snapshot
        run: |
          SNAPSHOT="database/schema/${PREVIOUS_RELEASE}.mysql.sql"
          [ -f "$SNAPSHOT" ] || { echo "::error::snapshot $SNAPSHOT missing — regenerate per release-notes.md"; exit 1; }
          mysql -h 127.0.0.1 -u root -proot -e \
            "CREATE DATABASE $UPGRADE_DB; CREATE DATABASE $FRESH_DB; \
             GRANT ALL ON $UPGRADE_DB.* TO 'nexusphp'@'%'; GRANT ALL ON $FRESH_DB.* TO 'nexusphp'@'%';"
          mysql -h 127.0.0.1 -u root -proot "$UPGRADE_DB" < "$SNAPSHOT"
          echo "Snapshot $PREVIOUS_RELEASE loaded: $(mysql -h 127.0.0.1 -u root -proot -N -e "SELECT COUNT(*) FROM $UPGRADE_DB.migrations") migrations recorded"

      - name: Insert production-like fixture data
        run: mysql -h 127.0.0.1 -u root -proot "$UPGRADE_DB" < scripts/ci/migration-upgrade-fixture.sql

      - name: Run HEAD migrations on previous-release database
        run: |
          START=$(date +%s)
          DB_DATABASE=$UPGRADE_DB php artisan migrate --force
          DURATION=$(( $(date +%s) - START ))
          echo "migration_duration_seconds=$DURATION" >> "$GITHUB_STEP_SUMMARY"
          echo "HEAD migrations completed in ${DURATION}s"

      - name: Build fresh reference schema
        run: DB_DATABASE=$FRESH_DB php artisan migrate:fresh --force

      - name: Verify upgrade result
        run: bash scripts/ci/verify-migration-upgrade.sh "$UPGRADE_DB" "$FRESH_DB"

  unit-tests-matrix:
    name: Resolve PHPUnit matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # PRs: only the supported-matrix edges (newest + oldest).
            echo 'matrix={"php":["8.5","8.4"],"mysql":["9.0","8.0"],"exclude":[{"php":"8.5","mysql":"8.0"},{"php":"8.4","mysql":"9.0"}]}' >> "$GITHUB_OUTPUT"
          else
            # Push: full matrix.
            echo 'matrix={"php":["8.4","8.5"],"mysql":["8.0","9.0"]}' >> "$GITHUB_OUTPUT"
          fi

  unit-tests:
    needs: [unit-tests-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.unit-tests-matrix.outputs.matrix) }}
    # Per-cell check names come from the callee job
    # ("PHPUnit Unit (PHP X, MySQL Y)").
    uses: ./.github/workflows/test-stack.yml
    with:
      php-version: ${{ matrix.php }}
      mysql-version: ${{ matrix.mysql }}

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexusphp
          MYSQL_USER: nexusphp
          MYSQL_PASSWORD: nexusphp
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP stack
        uses: ./.github/actions/setup-php-stack
        with:
          coverage: xdebug

      - name: Prepare environment
        run: bash scripts/ci/env-ci-services.sh

      - name: Wait for MySQL and prepare test databases
        # Create isolated test databases for Unit and Feature suites.
        # Separate databases allow the two suites to run with independent
        # fixtures and prevent any risk of cross-suite data interference.
        # Both names carry the "testing" marker required by
        # DestructiveEnvironmentGuard.
        run: bash scripts/ci/prepare-test-db.sh nexusphp_unit_testing nexusphp_feature_testing

      - name: Run PHPUnit Unit + Integration with coverage
        # Оба сюита в одном clover-файле: до разделения tests/Unit они были
        # одним набором, и порог "Unit ≥ 35%" ниже калиброван на их сумме.
        # Integration остаётся на nexusphp_unit_testing — та же изолированная БД.
        run: DB_DATABASE=nexusphp_unit_testing vendor/bin/phpunit --testsuite Unit,Integration --coverage-clover=coverage-unit.xml

      - name: Run PHPUnit Feature with coverage
        # NEXUS_LEGACY_CONTEXT=1 → tests/bootstrap.php defines IN_NEXUS=true so
        # Feature tests exercise the same code paths as the production front controller.
        run: NEXUS_LEGACY_CONTEXT=1 DB_DATABASE=nexusphp_feature_testing vendor/bin/phpunit --testsuite Feature --coverage-clover=coverage-feature.xml --coverage-html=coverage-html

      - name: Run PHPUnit Performance
        run: DB_DATABASE=nexusphp_feature_testing vendor/bin/phpunit --testsuite Performance --no-coverage

      - name: Upload coverage to Codecov (Unit + Feature flags)
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        continue-on-error: true
        with:
          files: ./coverage-unit.xml,./coverage-feature.xml
          flags: unit,feature
          # T-16: Patch coverage target — 60% of new/changed lines must
          # be covered. Codecov enforces this server-side when configured
          # in codecov.yml. The token is needed for patch coverage to work.
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Minimum coverage gate (Unit + Integration ≥ 35%)
        # W0-04: Fail-closed coverage gate.
        # Reads line coverage from Clover XML files already generated
        # by the Unit+Integration and Feature steps above — no test re-runs.
        # Fails on missing files, parse errors, or Unit coverage below floor.
        # Only Unit coverage is gated — Feature coverage is informational
        # since feature tests require full infrastructure and naturally
        # have lower coverage.
        run: python3 scripts/ci/coverage-gate.py

      - name: Per-module coverage ratchet (W3-06)
        # W3-06: Enforce per-module coverage thresholds.
        # Each app/ subdirectory has its own minimum coverage floor.
        # The baseline file ratchets up — coverage can only increase,
        # never decrease. Fails if any module falls below its threshold.
        run: |
          php artisan coverage:ratchet coverage-unit.xml \
            --baseline=.coverage-baseline.json \
            --report

      - name: Upload coverage baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-baseline
          # Dotfiles are skipped by the globber unless asked for —
          # without this the artifact silently carried only the report.
          include-hidden-files: true
          path: |
            .coverage-baseline.json
            coverage-report.json
          retention-days: 30

      - name: Upload HTML coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-html
          path: coverage-html
          retention-days: 14

      - name: Generate app() usage report (W2-01)
        run: php artisan app:usage-report --top=20 --output=app-usage-report.md
        continue-on-error: true

      - name: Upload app() usage report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: app-usage-report
          path: app-usage-report.md
          retention-days: 30

  smoke-test:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: [static-analysis, unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP stack
        uses: ./.github/actions/setup-php-stack

      - name: Prepare environment
        run: bash scripts/ci/env-compose-dev.sh

      - name: Build Docker images
        run: docker compose build

      - name: Start core services and wait
        run: docker compose up -d --wait mysql redis php

      - name: Install database
        run: docker compose exec -T php php artisan migrate:fresh --seed --force

      - name: Start remaining services and wait
        run: docker compose up -d --wait

      - name: Cache Laravel bootstrap files
        run: |
          docker compose exec -T php php artisan storage:link --force
          docker compose exec -T php php artisan route:cache
          docker compose exec -T php php artisan view:cache
          docker compose exec -T php php artisan icons:cache
          docker compose exec -T php php artisan filament:cache-components

      - name: Smoke test public pages
        run: bash scripts/ci/smoke-pages.sh /index /login /signup /torrents /topten

      - name: Clear any stale Laravel config cache
        run: docker compose exec -T php php artisan config:clear

      - name: Import MeiliSearch index
        run: docker compose exec -T php php artisan meilisearch:import

      - name: Run Feature tests
        run: |
          # Flush Redis to clear any cached settings from migrate:fresh
          source .env 2>/dev/null
          docker compose exec -T redis sh -c "redis-cli -a \"\${REDIS_PASSWORD:-}\" FLUSHALL" 2>/dev/null || true
          # Feature tests use the isolated E2E database (nexusphp_e2e_testing),
          # same as the OpenResty/PHP-FPM stack. CriticalPathTest reads
          # E2E_DB_DATABASE to match the connection used by HTTP requests.
          docker compose exec -T \
            -e CRITICAL_PATH_BASE_URL=http://openresty \
            -e DB_DATABASE=nexusphp_e2e_testing \
            -e E2E_DB_DATABASE=nexusphp_e2e_testing \
            -e NEXUS_LEGACY_CONTEXT=1 \
            php vendor/bin/phpunit --testsuite Feature --no-coverage

  browser-smoke:
    name: Browser smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [static-analysis, unit-tests]
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP stack
        uses: ./.github/actions/setup-php-stack

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/browser/package-lock.json

      - name: Prepare environment
        run: bash scripts/ci/env-compose-dev.sh

      - name: Build Docker images
        run: docker compose build

      - name: Start core services and wait
        run: docker compose up -d --wait mysql redis php

      - name: Install database
        run: docker compose exec -T php php artisan migrate:fresh --seed --force

      - name: Create browser-test admin and configure settings
        run: |
          # Login target for the suite (same account the playbooks use).
          docker compose exec -T php php artisan user:reset_id_auto_increment \
            --auto_increment=10001 --admin=sysop --password=TestPass2026 \
            --email=sysop@example.com
          # security.maxip caps signups per IP; the e2e gateway IP must not
          # trip it. basic.baseUrl must match the origin the browser uses —
          # confirm.php redirects to it and CSP form-action 'self' blocks
          # cross-origin redirects after POST /signup. security.iv seeds to
          # 'yes' (image captcha on login/signup) — headless tests cannot
          # solve it, so it is disabled like PerformanceTestDatasetSeeder does.
          docker compose exec -T php php artisan tinker --execute="DB::table('settings')->where('name','security.maxip')->update(['value'=>100]); DB::table('settings')->where('name','basic.baseUrl')->update(['value'=>'http://127.0.0.1']); DB::table('settings')->where('name','security.iv')->update(['value'=>'no']);"
          source .env 2>/dev/null
          docker compose exec -T redis sh -c "redis-cli -a \"\${REDIS_PASSWORD:-}\" FLUSHALL" 2>/dev/null || true

      - name: Start remaining services and wait
        run: docker compose up -d --wait

      - name: Wait for OpenResty
        run: |
          for i in $(seq 1 30); do
            curl -sfL http://127.0.0.1:80/health/live -o /dev/null 2>/dev/null && exit 0
            sleep 2
          done
          echo "::error::OpenResty not responding" && exit 1

      - name: Install browser-test dependencies
        working-directory: tests/browser
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke suite
        working-directory: tests/browser
        env:
          BROWSER_BASE_URL: http://127.0.0.1:80
          BROWSER_USER: sysop
          BROWSER_PASS: TestPass2026
          BROWSER_TID: '1'
        run: npx playwright test

      - name: Remove accounts created by the signup spec
        if: always()
        run: |
          docker compose exec -T php php artisan tinker \
            --execute="DB::table('users')->where('username','like','pw%')->delete();" || true

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-browser-smoke
          path: |
            tests/browser/playwright-report/
            tests/browser/test-results/
          retention-days: 14

  codeql:
    name: CodeQL security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep-blocking:
    name: Semgrep blocking rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Semgrep
        run: pip install semgrep==1.89.0

      - name: Run blocking Semgrep rules
        run: |
          set -euo pipefail
          semgrep scan --config .semgrep.blocking.yml --sarif --output semgrep-blocking-results.sarif
          echo "## Semgrep blocking results" >> "$GITHUB_STEP_SUMMARY"
          echo "0 blocking findings — all clear." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload blocking results to GitHub Security
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        with:
          sarif_file: semgrep-blocking-results.sarif

  semgrep-informational:
    name: Semgrep informational rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Semgrep
        run: pip install semgrep==1.89.0

      - name: Run informational rules + baseline compare
        run: bash scripts/ci/semgrep-informational.sh

      - name: Upload informational results to GitHub Security
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        with:
          sarif_file: semgrep-info-results.sarif

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Dependency review
        uses: actions/dependency-review-action@05fe4576374b728f0c523d6a13d64c25081e0803 # v4.8.3
        continue-on-error: true
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # Block GPL-incompatible licenses in production dependencies.
          # tracker-lp-bits is GPL-2.0-only — allow GPL-2.0-compatible licenses.
          deny-licenses: AGPL-3.0,AGPL-3.0-only,AGPL-3.0-or-later,Apache-2.0,BSD-4-Clause,CC-BY-NC-1.0,CC-BY-NC-2.0,CC-BY-NC-2.5,CC-BY-NC-3.0,CC-BY-NC-4.0,CC-BY-NC-ND-1.0,CC-BY-NC-ND-2.0,CC-BY-NC-ND-2.5,CC-BY-NC-ND-3.0,CC-BY-NC-ND-4.0,CC-BY-NC-SA-1.0,CC-BY-NC-SA-2.0,CC-BY-NC-SA-2.5,CC-BY-NC-SA-3.0,CC-BY-NC-SA-4.0,MS-RL

  container-scan:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare environment
        run: bash scripts/ci/env-compose-dev.sh

      - name: Build Docker images
        run: docker compose build php openresty

      - name: Validate .trivyignore entries
        run: bash scripts/ci/trivy-validate-ignore.sh

      - name: Run Trivy on PHP image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: nexusphp_php:latest
          format: sarif
          output: trivy-php-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          trivyignores: .trivyignore
          version: v0.74.0

      - name: Run Trivy on OpenResty image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: nexusphp_openresty:latest
          format: sarif
          output: trivy-openresty-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          trivyignores: .trivyignore
          version: v0.74.0

      - name: Check Trivy results for actionable vulnerabilities
        run: bash scripts/ci/trivy-check-results.sh

      - name: Upload Trivy PHP scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        with:
          sarif_file: trivy-php-results.sarif
          category: trivy-php

      - name: Upload Trivy OpenResty scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        with:
          sarif_file: trivy-openresty-results.sarif
          category: trivy-openresty

  sbom:
    name: SBOM generation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP stack
        uses: ./.github/actions/setup-php-stack
        with:
          composer-cache: 'false'
          dump-autoload: 'false'

      - name: Generate Composer SBOM (CycloneDX)
        run: |
          composer config --no-interaction allow-plugins.cyclonedx/cyclonedx-php-composer true
          composer require --dev cyclonedx/cyclonedx-php-composer:^5 --no-interaction --no-scripts
          composer CycloneDX:make-sbom --output-format=Json --output-file=composer-sbom.json --omit=dev
          echo "Composer SBOM generated: composer-sbom.json"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sbom
          path: |
            composer-sbom.json
          retention-days: 30

  infection:
    name: Mutation testing (Infection)
    runs-on: ubuntu-latest
    # T-16: Mutation testing for critical paths: Auth, Token, Bonus, Tracker,
    # Outbox, Policies, Torrent/Thanks mutations.
    # Full scope on push to php8 (min-msi=40 / min-covered-msi=50).
    # W3-04: on PRs, only changed critical files are mutated
    # (min-covered-msi=50 on the filtered set; global min-msi=0 because a
    # small file set cannot carry a project-wide MSI).
    # No `needs:` — both runs generate their own coverage via
    # --map-source-class-to-test / the initial test run.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/php8')
      || github.event_name == 'pull_request'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexusphp
          MYSQL_USER: nexusphp
          MYSQL_PASSWORD: nexusphp
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup PHP stack
        uses: ./.github/actions/setup-php-stack
        with:
          coverage: xdebug
          composer-cache: 'false'
          dump-autoload: 'false'
          # sendmail_path=/bin/true: legacy Mail::sent() calls @mail() which
          # spawns /usr/sbin/sendmail — absent on CI runners, its "not found"
          # stderr makes Infection stop the initial test run (exit 143).
          ini-values: memory_limit=2G, sendmail_path=/bin/true

      - name: Prepare environment
        run: bash scripts/ci/env-ci-services.sh --with-key

      - name: Wait for MySQL and prepare test database
        run: bash scripts/ci/prepare-test-db.sh nexusphp_unit_testing

      - name: Detect changed critical files (PR)
        if: github.event_name == 'pull_request'
        id: changed
        run: bash scripts/ci/infection-changed-files.sh "${{ github.base_ref }}"

      - name: Run Infection (full scope)
        if: github.event_name == 'push'
        run: |
          # --testsuite=Unit,Integration: оба сюита работают на дампе
          # nexusphp_unit_testing (до разделения это был один набор Unit).
          # Feature/Architecture идут на nexusphp_feature_testing/e2e в других
          # job'ах и на этом дампе невалидны.
          DB_DATABASE=nexusphp_unit_testing vendor/bin/infection \
            --configuration=infection.json5 \
            --threads=4 \
            --min-msi=40 \
            --min-covered-msi=50 \
            --no-progress \
            --logger-github \
            --test-framework-extra-args="--testsuite=Unit,Integration"

      - name: Run Infection (changed files only)
        # W3-04 follow-up: PR-scoped mutation is now fail-closed for the
        # set of critical files. Full-scope mutation on php8 still enforces
        # the global 40/50 thresholds after merge.
        if: github.event_name == 'pull_request' && steps.changed.outputs.skip != 'true'
        run: |
          DB_DATABASE=nexusphp_unit_testing vendor/bin/infection \
            --configuration=infection.json5 \
            --threads=4 \
            --no-progress \
            --logger-github \
            --min-msi=0 \
            --min-covered-msi=50 \
            --filter="${{ steps.changed.outputs.filter }}" \
            --map-source-class-to-test \
            --test-framework-extra-args="--testsuite=Unit,Integration"

      - name: Upload Infection logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && (github.event_name == 'push' || steps.changed.outputs.skip != 'true')
        with:
          name: infection-logs-${{ github.event_name }}
          path: |
            infection.log
            infection-summary.log
          retention-days: 14

  prod-compose-smoke:
    name: Production Compose smoke test
    runs-on: ubuntu-latest
    needs: [smoke-test]
    # W8-01: builds the hardened prod image (Dockerfile.prod) and verifies
    # the production compose stack end-to-end. Push-only: the bring-up is
    # heavy and app-code PRs rarely change the prod image.
    if: github.event_name == 'push'
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare environment
        run: bash scripts/ci/env-compose-prod.sh

      - name: Build production Docker image
        run: docker compose build php

      - name: Start core services and wait
        run: docker compose up -d --wait mysql redis php

      - name: Debug PHP container logs (on failure)
        if: failure()
        run: |
          echo "=== PHP container logs ==="
          docker compose logs php 2>&1 || true
          echo "=== PHP container status ==="
          docker compose ps -a php 2>&1 || true

      - name: Install database
        run: docker compose exec -T php php artisan migrate:fresh --seed --force

      - name: Start remaining services and wait
        run: docker compose up -d --wait

      - name: Debug all container logs (on failure)
        if: failure()
        run: |
          echo "=== All containers ==="
          docker compose ps -a 2>&1 || true
          for svc in php openresty queue scheduler meilisearch; do
            echo "=== $svc logs ==="
            docker compose logs --tail=50 $svc 2>&1 || true
          done

      - name: Verify production stack
        run: bash scripts/ci/verify-prod-compose.sh

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v --remove-orphans || true

  backup-restore:
    name: Backup/restore verification
    runs-on: ubuntu-latest
    needs: [smoke-test]
    # W8-03: a backup that was never restored is not a backup. Proves the
    # production code path end-to-end: backup:all (web tar + mysqldump
    # bundle) -> restore-drill into a scratch DB (row-count comparison) ->
    # destroy the live DB and data dirs -> restore from the bundle ->
    # CHECKSUM TABLE + sha256 manifest parity -> HTTP smoke.
    # Push-only like prod-compose-smoke: the docker bring-up dominates and
    # the backup path rarely regresses with app-code changes.
    if: github.event_name == 'push'
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP stack
        uses: ./.github/actions/setup-php-stack

      - name: Prepare environment
        run: bash scripts/ci/env-compose-dev.sh

      - name: Build Docker images
        run: docker compose build

      # queue/scheduler are deliberately not started: their background writes
      # would drift table checksums between the snapshot and the restore.
      - name: Start core services and wait
        run: docker compose up -d --wait mysql redis php

      - name: Install database
        run: docker compose exec -T php php artisan migrate:fresh --seed --force

      - name: Start OpenResty and wait
        run: docker compose up -d --wait openresty

      - name: Debug container logs (on failure)
        if: failure()
        run: |
          docker compose ps -a 2>&1 || true
          for svc in php openresty mysql; do
            echo "=== $svc logs ==="
            docker compose logs --tail=50 $svc 2>&1 || true
          done

      - name: Run backup/destroy/restore verification
        run: bash scripts/ci/verify-backup-restore.sh

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v --remove-orphans || true

  deploy-graceful:
    name: Graceful deployment drill
    runs-on: ubuntu-latest
    needs: [smoke-test]
    # W8-04: proves deploys lose no in-flight queue jobs and gate traffic on
    # readiness. `docker compose stop queue` must drain Horizon (SIGTERM,
    # 125s grace) rather than SIGKILL at the 10s default; the operator path
    # scripts/deploy.sh is exercised end-to-end on the prod overlay.
    if: github.event_name == 'push'
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare environment
        run: bash scripts/ci/env-compose-prod.sh

      - name: Build production Docker image
        run: docker compose build php

      - name: Start core services and wait
        run: docker compose up -d --wait mysql redis php

      - name: Install database
        run: docker compose exec -T php php artisan migrate:fresh --seed --force

      - name: Start remaining services and wait
        run: docker compose up -d --wait

      - name: Debug container logs (on failure)
        if: failure()
        run: |
          docker compose ps -a 2>&1 || true
          for svc in php openresty queue scheduler mysql; do
            echo "=== $svc logs ==="
            docker compose logs --tail=50 $svc 2>&1 || true
          done

      - name: Run graceful-deployment drill
        run: bash scripts/ci/verify-graceful-deploy.sh

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v --remove-orphans || true

  publish-images:
    name: Publish + sign production images
    runs-on: ubuntu-latest
    needs: [prod-compose-smoke, backup-restore, deploy-graceful]
    # W8-05: only merge-proven images get published and signed — the job
    # runs after all three heavy prod gates pass on the merge push.
    if: github.event_name == 'push' && github.ref == 'refs/heads/php8'
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # cosign keyless OIDC
      attestations: write  # build-provenance attestations
    timeout-minutes: 30
    env:
      REGISTRY: ghcr.io
      # ghcr.io/<owner>/<repo>/php and .../openresty
      IMAGE_NS: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push production images
        run: bash scripts/ci/publish-images.sh
        id: build

      - name: Sign image digests (keyless)
        run: |
          cosign sign --yes "${PHP_IMAGE_REF}"
          cosign sign --yes "${OPENRESTY_IMAGE_REF}"

      - name: Attest build provenance (php)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.image-ns }}/php
          subject-digest: ${{ steps.build.outputs.php-digest }}
          push-to-registry: true

      - name: Attest build provenance (openresty)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.image-ns }}/openresty
          subject-digest: ${{ steps.build.outputs.openresty-digest }}
          push-to-registry: true

      # Round-trip: the exact verification operators run in verify-image.sh
      # must succeed against what we just pushed — a signature nobody can
      # verify is worse than none.
      - name: Verify signatures round-trip
        run: |
          bash scripts/verify-image.sh "${PHP_IMAGE_REF}"
          bash scripts/verify-image.sh "${OPENRESTY_IMAGE_REF}"
