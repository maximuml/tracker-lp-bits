name: A11y accessibility scan

on:
  push:
    branches: [php8]
  pull_request:
    branches: [php8]

permissions:
  contents: read

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe-scan:
    name: axe-core accessibility scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca864b1bfa09482549a52af7be # v4
        with:
          node-version: '20'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@568a8114fe89c7865cf6c37c7f5d1c2cf83f2e97 # v1
        with:
          chrome-version: stable

      - name: Install axe-core CLI
        run: npm install -g @axe-core/cli

      - name: Build and start Docker stack
        env:
          NP_PORT: '80'
        run: |
          cp .env.example .env
          # CI Redis has no password — clear it
          sed -i 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=/' .env
          docker compose build
          docker compose up -d --wait mysql redis php openresty
          docker compose exec -T php php artisan migrate:fresh --seed --force
          docker compose exec -T php php artisan storage:link --force
          docker compose exec -T redis sh -c "redis-cli -a \"${REDIS_PASSWORD:-}\" FLUSHALL" 2>/dev/null || true

      - name: Run axe-core scans
        run: |
          set -e
          BASE=http://127.0.0.1:80
          PASS=0
          FAIL=0

          # Pages that don't require authentication
          PAGES="/index.php /login.php /signup.php"

          for page in $PAGES; do
            echo "::group::Scanning $page"
            if axe "$BASE$page" --headless --exit --tags wcag2a,wcag2aa --load-delay=3000 2>&1; then
              echo "PASS: $page"
              PASS=$((PASS + 1))
            else
              echo "FAIL: $page"
              FAIL=$((FAIL + 1))
            fi
            echo "::endgroup::"
          done

          echo "Results: $PASS passed, $FAIL failed"
          if [ "$FAIL" -gt 0 ]; then
            echo "::error::$FAIL pages have accessibility violations"
            exit 1
          fi
