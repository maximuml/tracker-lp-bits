; Production-ready OPcache defaults for the tracker.
; Override opcache.validate_timestamps and opcache.revalidate_freq in the
; container environment when active development is not required.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
opcache.save_comments = 1
