services:
  php:
    build:
      dockerfile: .docker/php/Dockerfile
    image: nexusphp_php
    container_name: nexusphp-php
    environment:
      SERVICE_NAME: php
    volumes:
      - .:/var/www/html
      - ${NP_BACKUP_EXPORT_PATH:-/tmp/nexusphp_backup}:${NP_BACKUP_EXPORT_PATH:-/tmp/nexusphp_backup}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/php-fpm.sock || test -f /run/php-fpm.pid || nc -z 127.0.0.1 9000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet
    restart: unless-stopped

  queue:
    image: nexusphp_php
    container_name: nexusphp-queue
    environment:
      SERVICE_NAME: queue
    volumes:
      - .:/var/www/html
    depends_on:
      php:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet
    restart: always

  scheduler:
    image: nexusphp_php
    container_name: nexusphp-scheduler
    environment:
      SERVICE_NAME: scheduler
    volumes:
      - .:/var/www/html
      - ${NP_BACKUP_EXPORT_PATH:-/tmp/nexusphp_backup}:${NP_BACKUP_EXPORT_PATH:-/tmp/nexusphp_backup}
    depends_on:
      php:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet
    restart: always

  cleanup:
    image: nexusphp_php
    container_name: nexusphp-cleanup
    environment:
      SERVICE_NAME: cleanup
    volumes:
      - .:/var/www/html
    depends_on:
      php:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet
    restart: always

  openresty:
    build:
      dockerfile: .docker/openresty/Dockerfile
    container_name: nexusphp-openresty
    environment:
      NP_DOMAIN: ${NP_DOMAIN:-localhost}
      NP_PORT: ${NP_PORT:-80}
    volumes:
      - ./.docker/openresty/sites:/etc/nginx/conf.d/sites
      - ./.docker/openresty/certs:/certs
      - ./.docker/openresty/entrypoint.sh:/usr/local/bin/entrypoint.sh
      - ./.docker/openresty/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf
      - ./.docker/openresty/lua:/usr/local/openresty/lua
      - .:/var/www/html
    depends_on:
      php:
        condition: service_healthy
      phpmyadmin:
        condition: service_started
    command: ["/bin/sh", "/usr/local/bin/entrypoint.sh"]
    ports:
      - "${NP_PORT:-80}:${NP_PORT:-80}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${NP_PORT:-80}/login.php >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet

  redis:
    image: redis:alpine
    container_name: nexusphp-redis
    command: redis-server
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet

  mysql:
    image: mysql:9
    container_name: nexusphp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-nexusphp}
      MYSQL_USER: ${DB_USERNAME:-nexusphp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-nexusphp}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: nexusphp-phpmyadmin
    environment:
      PMA_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet

volumes:
  mysql-data:
  redis-data:

networks:
  appnet:
