name: CI

on:
  push:
    branches: ["php8"]
  pull_request:
    branches: ["php8"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Lint + Pint + PHPStan L8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, gd, gmp, intl, json, mbstring, mysqli, pdo, pdo_mysql, redis, sqlite3, xml, zip
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Dump autoload
        run: composer dump-autoload --no-interaction --no-scripts

      - name: Audit composer dependencies
        run: composer audit

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Run PHP syntax lint
        run: |
          find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -not -path './.docker/*' \
            -not -path './public/vendor/*' \
            -not -path './storage/*' \
            -print0 | xargs -0 -n1 -P4 php -l

      - name: Run Laravel Pint
        run: vendor/bin/pint --test

      - name: Run PHPStan level 8
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

  raw-sql-ratchet:
    name: Raw SQL ratchet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check raw SQL query count
        run: |
          BASELINE_COUNT=11
          CURRENT=$(grep -rn 'DB::\(select\|statement\|unprepared\)\s*(' app/ --include="*.php" \
            | grep -v 'Support/Install' \
            | wc -l)
          CURRENT_SUBQUERY=$(grep -rn 'DB::table\s*(\s*DB::raw' app/ --include="*.php" \
            | grep -v 'Support/Install' \
            | wc -l)
          TOTAL=$((CURRENT + CURRENT_SUBQUERY))
          echo "Baseline: $BASELINE_COUNT"
          echo "Current raw queries: $CURRENT"
          echo "Current raw subqueries: $CURRENT_SUBQUERY"
          echo "Total: $TOTAL"
          if [ "$TOTAL" -gt "$BASELINE_COUNT" ]; then
            echo "::error::Raw SQL query count increased from $BASELINE_COUNT to $TOTAL. \
          See .raw-queries-baseline.txt for the allowed list. \
          Use query builder instead of DB::select/statement/unprepared."
            exit 1
          fi
          echo "OK: raw SQL query count ($TOTAL) <= baseline ($BASELINE_COUNT)"

  frontend:
    name: Build + audit npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Audit npm dependencies
        run: npm audit

  unit-tests:
    name: PHPUnit Unit (PHP ${{ matrix.php }}, MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        mysql: ['8.0', '9.0']

    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexusphp
          MYSQL_USER: nexusphp
          MYSQL_PASSWORD: nexusphp
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, gd, gmp, intl, json, mbstring, mysqli, pdo, pdo_mysql, redis, sqlite3, xml, zip
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Dump autoload
        run: composer dump-autoload --no-interaction --no-scripts

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/^CACHE_DRIVER=.*/CACHE_DRIVER=array/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          sed -i 's/^CHANNEL_NAME_SETTING=.*/CHANNEL_NAME_SETTING=/' .env
          sed -i 's/^CHANNEL_NAME_MODEL_EVENT=.*/CHANNEL_NAME_MODEL_EVENT=/' .env
          sed -i 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=/' .env
          # Redis isolation: use DB index 15 for tests to avoid clobbering
          sed -i 's/^REDIS_DB=.*/REDIS_DB=15/' .env
          # MeiliSearch isolation: disable Scout for unit/coverage tests
          echo "SCOUT_DRIVER=null" >> .env

      - name: Cache Laravel bootstrap files
        run: |
          php artisan storage:link --force
          php artisan route:cache
          php artisan view:cache
          php artisan icons:cache
          php artisan filament:cache-components

      - name: Wait for MySQL and migrate
        run: |
          for i in $(seq 1 60); do
            nc -z 127.0.0.1 3306 && break
            sleep 1
          done
          nc -z 127.0.0.1 3306 || { echo "MySQL did not become ready in time"; exit 1; }
          php artisan migrate:fresh --seed --force
          # Create isolated test database (phpunit.xml uses nexusphp_testing)
          # to prevent tests from truncating tables in the seed database.
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS nexusphp_testing CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON nexusphp_testing.* TO 'nexusphp'@'%'; FLUSH PRIVILEGES;"
          # Copy schema + seed data for tables tests depend on (settings, users)
          mysqldump -h 127.0.0.1 -u root -proot --no-data --skip-comments --set-gtid-purged=OFF --single-transaction nexusphp | mysql -h 127.0.0.1 -u root -proot nexusphp_testing
          mysqldump -h 127.0.0.1 -u root -proot --no-create-info --skip-comments --set-gtid-purged=OFF --single-transaction nexusphp settings users | mysql -h 127.0.0.1 -u root -proot nexusphp_testing

      - name: Run PHPUnit unit tests
        run: DB_DATABASE=nexusphp_testing vendor/bin/phpunit --testsuite Unit --no-coverage

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexusphp
          MYSQL_USER: nexusphp
          MYSQL_PASSWORD: nexusphp
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, gd, gmp, intl, json, mbstring, mysqli, pdo, pdo_mysql, redis, sqlite3, xml, zip
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Dump autoload
        run: composer dump-autoload --no-interaction --no-scripts

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/^CACHE_DRIVER=.*/CACHE_DRIVER=array/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          sed -i 's/^CHANNEL_NAME_SETTING=.*/CHANNEL_NAME_SETTING=/' .env
          sed -i 's/^CHANNEL_NAME_MODEL_EVENT=.*/CHANNEL_NAME_MODEL_EVENT=/' .env
          sed -i 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=/' .env
          # Redis isolation: use DB index 15 for tests to avoid clobbering
          sed -i 's/^REDIS_DB=.*/REDIS_DB=15/' .env
          # MeiliSearch isolation: disable Scout for unit/coverage tests
          echo "SCOUT_DRIVER=null" >> .env

      - name: Wait for MySQL and migrate
        run: |
          for i in $(seq 1 60); do
            nc -z 127.0.0.1 3306 && break
            sleep 1
          done
          nc -z 127.0.0.1 3306 || { echo "MySQL did not become ready in time"; exit 1; }
          php artisan migrate:fresh --seed --force
          # Create isolated test database (phpunit.xml uses nexusphp_testing)
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS nexusphp_testing CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON nexusphp_testing.* TO 'nexusphp'@'%'; FLUSH PRIVILEGES;"
          mysqldump -h 127.0.0.1 -u root -proot --no-data --skip-comments --set-gtid-purged=OFF --single-transaction nexusphp | mysql -h 127.0.0.1 -u root -proot nexusphp_testing
          # Copy seed data for tables Feature tests depend on:
          # settings/users — config + auth, searchbox/searchbox_fields — browse mode,
          # categories — torrent listing, agent_allowed_family/agent_allowed_exception — announce client check
          mysqldump -h 127.0.0.1 -u root -proot --no-create-info --skip-comments --set-gtid-purged=OFF --single-transaction nexusphp settings users searchbox searchbox_fields categories agent_allowed_family agent_allowed_exception | mysql -h 127.0.0.1 -u root -proot nexusphp_testing

      - name: Run PHPUnit Unit with coverage
        run: DB_DATABASE=nexusphp_testing vendor/bin/phpunit --testsuite Unit --coverage-clover=coverage-unit.xml

      - name: Run PHPUnit Feature with coverage
        run: DB_DATABASE=nexusphp_testing vendor/bin/phpunit --testsuite Feature --coverage-clover=coverage-feature.xml --coverage-html=coverage-html

      - name: Merge Clover coverage reports
        run: |
          # Merge Unit and Feature Clover reports into a single file
          # Codecov accepts multiple files, but a single merged file is simpler
          php -r "
          \$unit = simplexml_load_file('coverage-unit.xml');
          \$feature = simplexml_load_file('coverage-feature.xml');
          if (\$unit === false || \$feature === false) {
            fwrite(STDERR, 'Failed to load Clover XML files' . PHP_EOL);
            exit(1);
          }
          // Merge project nodes from feature into unit
          foreach (\$feature->project as \$project) {
            \$unit->addChild('project', (string) \$project);
          }
          \$unit->asXML('coverage.xml');
          echo 'Merged coverage.xml created' . PHP_EOL;
          "

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: true

      - name: Upload HTML coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-html
          path: coverage-html
          retention-days: 14

  smoke-test:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: [static-analysis, unit-tests, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, gd, gmp, intl, json, mbstring, mysqli, pdo, pdo_mysql, redis, sqlite3, xml, zip
          coverage: none

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's|DB_HOST=127.0.0.1|DB_HOST=mysql|g' .env
          sed -i 's|REDIS_HOST=127.0.0.1|REDIS_HOST=redis|g' .env
          sed -i 's|LOG_FILE=.*|LOG_FILE=php://stdout|g' .env
          # .env.example leaves MEILISEARCH_MASTER_KEY empty so users must set
          # their own. For the smoke-test stack, restore the compose default.
          sed -i 's|^MEILISEARCH_MASTER_KEY=.*|MEILISEARCH_MASTER_KEY=nexusphp_default_key|' .env

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Dump autoload
        run: composer dump-autoload --no-interaction --no-scripts

      - name: Build Docker images
        run: docker compose build

      - name: Start core services and wait
        run: docker compose up -d --wait mysql redis php

      - name: Install database
        run: docker compose exec -T php php artisan migrate:fresh --seed --force

      - name: Start remaining services and wait
        run: docker compose up -d --wait

      - name: Cache Laravel bootstrap files
        run: |
          docker compose exec -T php php artisan storage:link --force
          docker compose exec -T php php artisan route:cache
          docker compose exec -T php php artisan view:cache
          docker compose exec -T php php artisan icons:cache
          docker compose exec -T php php artisan filament:cache-components

      - name: Smoke test public pages
        run: |
          set -e
          for page in /index.php /login.php /signup.php /torrents.php /topten.php; do
            echo "Testing $page"
            curl -sfL --max-time 10 "http://localhost$page" -o /dev/null
          done

      - name: Clear any stale Laravel config cache
        run: docker compose exec -T php php artisan config:clear

      - name: Import MeiliSearch index
        run: docker compose exec -T php php artisan meilisearch:import

      - name: Run Feature tests
        run: |
          # Flush Redis to clear any cached settings from migrate:fresh
          source .env 2>/dev/null
          docker compose exec -T redis sh -c "redis-cli -a \"\${REDIS_PASSWORD:-}\" FLUSHALL" 2>/dev/null || true
          # Feature tests use nexusphp (main DB) — same as OpenResty.
          docker compose exec -T -e CRITICAL_PATH_BASE_URL=http://openresty php vendor/bin/phpunit --testsuite Feature --no-coverage

  codeql:
    name: CodeQL security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's|DB_HOST=127.0.0.1|DB_HOST=mysql|g' .env
          sed -i 's|REDIS_HOST=127.0.0.1|REDIS_HOST=redis|g' .env
          sed -i 's|^MEILISEARCH_MASTER_KEY=.*|MEILISEARCH_MASTER_KEY=nexusphp_default_key|' .env

      - name: Build Docker images
        run: docker compose build php openresty

      - name: Run Trivy on PHP image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: nexusphp_php:latest
          format: sarif
          output: trivy-php-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Run Trivy on OpenResty image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: nexusphp_openresty:latest
          format: sarif
          output: trivy-openresty-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        if: always()
        with:
          sarif_file: trivy-php-results.sarif

  sbom:
    name: SBOM generation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, gd, gmp, intl, json, mbstring, mysqli, pdo, pdo_mysql, redis, sqlite3, xml, zip
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Generate Composer SBOM (CycloneDX)
        run: |
          composer config --no-interaction allow-plugins.cyclonedx/cyclonedx-php-composer true
          composer require --dev cyclonedx/cyclonedx-php-composer:^5 --no-interaction --no-scripts
          composer CycloneDX:make-sbom --output-format=Json --output-file=composer-sbom.json --omit=dev
          echo "Composer SBOM generated: composer-sbom.json"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Generate npm SBOM (CycloneDX)
        run: |
          npx @cyclonedx/cyclonedx-npm --output-file=npm-sbom.json --omit dev
          echo "npm SBOM generated: npm-sbom.json"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sbom
          path: |
            composer-sbom.json
            npm-sbom.json
          retention-days: 30
