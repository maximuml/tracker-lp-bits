services:
  php:
    build:
      dockerfile: .docker/php/Dockerfile
    image: nexusphp_php
    container_name: nexusphp-php
    environment:
      SERVICE_NAME: php
      MEILISEARCH_HOST: ${MEILISEARCH_HOST:-meilisearch}
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-nexusphp_default_key}
    volumes:
      - .:/var/www/html
      - ${NP_BACKUP_EXPORT_PATH:-/tmp/nexusphp_backup}:${NP_BACKUP_EXPORT_PATH:-/tmp/nexusphp_backup}
    depends_on:
      - mysql
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet

  queue:
    image: nexusphp_php
    container_name: nexusphp-queue
    environment:
      SERVICE_NAME: queue
      MEILISEARCH_HOST: ${MEILISEARCH_HOST:-meilisearch}
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-nexusphp_default_key}
    volumes:
      - .:/var/www/html
    depends_on:
      - php
      - redis
      - mysql
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet
    restart: always

  scheduler:
    image: nexusphp_php
    container_name: nexusphp-scheduler
    environment:
      SERVICE_NAME: scheduler
      MEILISEARCH_HOST: ${MEILISEARCH_HOST:-meilisearch}
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-nexusphp_default_key}
    volumes:
      - .:/var/www/html
      - ${NP_BACKUP_EXPORT_PATH:-/tmp/nexusphp_backup}:${NP_BACKUP_EXPORT_PATH:-/tmp/nexusphp_backup}
    depends_on:
      - php
      - redis
      - mysql
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet
    restart: always

  cleanup:
    image: nexusphp_php
    container_name: nexusphp-cleanup
    environment:
      SERVICE_NAME: cleanup
      MEILISEARCH_HOST: ${MEILISEARCH_HOST:-meilisearch}
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-nexusphp_default_key}
    volumes:
      - .:/var/www/html
    depends_on:
      - php
      - redis
      - mysql
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet
    restart: always

  openresty:
    build:
      dockerfile: .docker/openresty/Dockerfile
    container_name: nexusphp-openresty
    environment:
      NP_DOMAIN: ${NP_DOMAIN:-localhost}
      NP_PORT: ${NP_PORT:-80}
    volumes:
      - ./.docker/openresty/sites:/etc/nginx/conf.d/sites
      - ./.docker/openresty/certs:/certs
      - ./.docker/openresty/entrypoint.sh:/usr/local/bin/entrypoint.sh
      - ./.docker/openresty/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf
      - ./.docker/openresty/lua:/usr/local/openresty/lua
      - .:/var/www/html
    depends_on:
      - php
      - phpmyadmin
    command: ["/bin/sh", "/usr/local/bin/entrypoint.sh"]
    ports:
      - "${NP_PORT:-80}:${NP_PORT:-80}"
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet

  redis:
    image: redis:alpine
    container_name: nexusphp-redis
    command: redis-server
    volumes:
      - redis-data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet

  mysql:
    image: mysql:9
    container_name: nexusphp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-nexusphp}
      MYSQL_USER: ${DB_USERNAME:-nexusphp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-nexusphp}
    volumes:
      - mysql-data:/var/lib/mysql
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: nexusphp-phpmyadmin
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet

  meilisearch:
    image: getmeili/meilisearch:v1.16
    container_name: nexusphp-meilisearch
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-nexusphp_default_key}
    volumes:
      - meilisearch-data:/meili_data
    ports:
      - "127.0.0.1:${MEILISEARCH_PORT:-7700}:7700"
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet

volumes:
  mysql-data:
  redis-data:
  meilisearch-data:

networks:
  appnet:
