version: 2

updates:
  # PHP dependencies (composer)
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - php
    groups:
      laravel:
        patterns:
          - "laravel/*"
          - "illuminate/*"
      filament:
        patterns:
          - "filament/*"
      dev-tools:
        patterns:
          - "phpstan/*"
          - "laravel/pint"
          - "phpunit/phpunit"
          - "mockery/mockery"

  # JavaScript dependencies (npm)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  # Docker
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
