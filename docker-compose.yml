# Base compose file — shared service definitions for all environments.
#
# Development:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Production:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# Dev-only services (phpMyAdmin) use the "debug" profile and are only started
# when explicitly requested: docker compose --profile debug up

services:
  php:
    build:
      dockerfile: .docker/php/Dockerfile
      args:
        NEXUSPHP_ENV: dev
    image: nexusphp_php
    container_name: nexusphp-php
    environment:
      SERVICE_NAME: php
      MEILISEARCH_HOST: ${MEILISEARCH_HOST:-meilisearch}
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?MEILISEARCH_MASTER_KEY is required}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/php-fpm.sock || test -f /run/php-fpm.pid || nc -z 127.0.0.1 9000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet
    restart: unless-stopped

  queue:
    image: nexusphp_php
    container_name: nexusphp-queue
    user: www-data
    environment:
      SERVICE_NAME: queue
      MEILISEARCH_HOST: ${MEILISEARCH_HOST:-meilisearch}
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?MEILISEARCH_MASTER_KEY is required}
    depends_on:
      php:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q 'running' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet
    restart: always

  scheduler:
    image: nexusphp_php
    container_name: nexusphp-scheduler
    user: www-data
    environment:
      SERVICE_NAME: scheduler
      MEILISEARCH_HOST: ${MEILISEARCH_HOST:-meilisearch}
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?MEILISEARCH_MASTER_KEY is required}
    depends_on:
      php:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan tinker --execute=\"echo 'ok';\" 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet
    restart: always

  openresty:
    build:
      dockerfile: .docker/openresty/Dockerfile
    image: nexusphp_openresty
    container_name: nexusphp-openresty
    environment:
      NP_DOMAIN: ${NP_DOMAIN:-localhost}
      NP_PORT: ${NP_PORT:-80}
    depends_on:
      php:
        condition: service_healthy
    command: ["/bin/sh", "/usr/local/bin/entrypoint.sh"]
    ports:
      - "${NP_PORT:-80}:${NP_PORT:-80}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sfL http://127.0.0.1:${NP_PORT:-80}/health/live -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet

  redis:
    # T-13: Digest-pinned for reproducible builds. Update via Renovate.
    image: redis:alpine@sha256:9c3ecc609a8087c0f11c494fefaf37a8f7bf9a967631d4a0da8967a9810be354
    container_name: nexusphp-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet

  mysql:
    # T-13: Digest-pinned for reproducible builds. Update via Renovate.
    image: mysql:9@sha256:313c76f59c62376fd26b78fc85169902ef10134996bbfc31200eb9c2ed7e802e
    container_name: nexusphp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_DATABASE: ${DB_DATABASE:-nexusphp}
      MYSQL_USER: ${DB_USERNAME:-nexusphp}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_PASSWORD:?DB_PASSWORD is required}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet

  phpmyadmin:
    # T-13: Digest-pinned for reproducible builds. Update via Renovate.
    image: phpmyadmin/phpmyadmin@sha256:42a200db07b4e70fbf32c594ad4521cf16399b8e54bbb5adceae98e7566dfbeb
    container_name: nexusphp-phpmyadmin
    profiles:
      - debug
    environment:
      PMA_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet

  meilisearch:
    # T-13: Digest-pinned for reproducible builds. Update via Renovate.
    image: getmeili/meilisearch:v1.53@sha256:81ffa96ce6e9a6769775d772742ed3da653ad34960cd6c3b43b98918c07db101
    container_name: nexusphp-meilisearch
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?MEILISEARCH_MASTER_KEY is required}
    volumes:
      - meilisearch-data:/meili_data
    ports:
      - "127.0.0.1:${MEILISEARCH_PORT:-7700}:7700"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health | grep -q available || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "1024m"
        max-file: "3"
    networks:
      - appnet

volumes:
  mysql-data:
  redis-data:
  meilisearch-data:

networks:
  appnet:
